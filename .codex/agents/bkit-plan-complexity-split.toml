8. Copy all tasks (preserve `Done when` and `Test first` entries verbatim) from master into sub-plans. Task-linked rows (`Derived Test Matrix`, `Reuse Inventory`, `Supersession Inventory`, `Documentation Updates`) → sub-plan holding linked task. Copy into every sub-plan: gate checkpoints; `Mandatory Tasks (Testing & Documentation)` and remaining sections scoped to its own tasks.
9. Each sub-plan self-contained per `docs/templates/bkit-plan.md`, include `**Parent Plan:** {master-plan-path}`.
10. Bidirectional links: Master → sub-plans and sub-plans → Master. Relative paths.
11. Self-verify before verdict (max 2 fix iterations); **If** still failing → `FAIL`:
