# .codex/config.toml — project-scoped Codex configuration. bkit writes no config.toml:
# `openai` is a reserved built-in provider id, so re-stating a provider block is rejected.
# This file is user-owned; Codex loads it only when the project is trusted.
#
# MCP servers, matching .mcp.json / .cursor/mcp.json / .opencode/opencode.json.

# Serena — local symbol lookup (read-only; `.serena/project.yml` keeps it lookup-only).
# Codex spawns `command` directly, so PATH-independent and portable: /bin/bash expands
# $HOME (a GUI/app launch has no login-shell PATH; ~/.local/bin is invisible to it).
[mcp_servers.serena]
command = "/bin/bash"
args = [
  "-c",
  "exec \"$HOME/.local/bin/serena\" start-mcp-server --context codex --project-from-cwd",
]

# GitHub — remote MCP. Token from BKIT_GH_TOKEN (same env var `.mcp.json` uses).
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "BKIT_GH_TOKEN"
http_headers = { "X-MCP-Toolsets" = "context,issues,pull_requests,repos,users,projects" }
