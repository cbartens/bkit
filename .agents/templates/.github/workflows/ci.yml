name: CI

on:
  push:
    branches: [{{DEFAULT_BRANCH}}, dev]
  pull_request:
    branches: [{{DEFAULT_BRANCH}}, dev]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: {{NODE_VERSION}}

      # Pnpm version is resolved from the consumer's package.json#packageManager (single SoT).
      # Do NOT add `with: version:` here — pnpm/action-setup@v4 errors when both are set.
      - uses: pnpm/action-setup@v4

      # bkit setup-auth@v1: configure @cbartens npm registry auth.
      # This composite action exports BKIT_READ_TOKEN into the job env so
      # pnpm install picks it up via the consumer's .npmrc.
      # RETAIN-WITH-REASON bash fallback: multi-line PAT-shim kept for
      # non-Actions CI consumers. Kill-date: v1.1.0.
      - uses: cbartens/bkit/.github/actions/setup-auth@v1
        with:
          token: ${{ secrets.GH_BKIT_TOKEN }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Vitest Tests
        run: pnpm test

      - name: Run Prettier Format Check
        run: pnpm format:check

      - name: Run Vale Prose Lint
        run: pnpm lint:prose

      - name: Run Slop Scan
        run: pnpm lint:slop

      - name: Run Bkit Check
        run: pnpm bkit check
