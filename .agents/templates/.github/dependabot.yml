# Dependabot configuration shipped by bkit.
# Tier 3 (seed-or-print): bkit writes this file once if absent; if present
# bkit will not overwrite — see install advisory `tier3-merge-suggested-dependabot.yml`
# for the recommended merge.
#
# Important: GitHub reads .github/dependabot.yml ONLY from the default branch
# (typically `main`). This file must be merged all the way through dev → main
# before Dependabot will start opening PRs. PRs land on `dev` (per
# `target-branch:` below), not on the branch where you committed this file.
#
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # GitHub Actions — refreshes SHA-pinned `uses:` lines on upstream releases
  # and CVE disclosures (paired with bkit's KN-3 SHA-pinning rule documented
  # in docs/security.md).
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # npm — opt-in. Uncomment and tune to your monorepo shape. For pnpm
  # workspaces, `directory: "/"` relies on hoisting; for explicit per-workspace
  # coverage, replace with `directories: ["/", "/packages/*"]` (Dependabot v2.1+).
