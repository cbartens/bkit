# Dependabot configuration for the bkit repo itself (dogfooding the template
# shipped by `bkit install` at `.agents/templates/.github/dependabot.yml`).
#
# Important: GitHub reads .github/dependabot.yml ONLY from the default branch
# (`main`). This file must reach `main` before Dependabot opens any PR. PRs
# land on `dev` (per `target-branch:` below) because `main` branch protection
# only accepts PRs from `dev`.
#
# npm ecosystem: deliberately omitted for v1. bkit is small, breaking-change
# tolerance for its dependencies is low, and turbo/vitest/pnpm major bumps
# need coordinated migration work. Revisit if/when manual upgrade cadence
# becomes painful — see GitHub issue #109.
#
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
