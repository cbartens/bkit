name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Pnpm version is resolved from the consumer's package.json#packageManager (single SoT).
      # Do NOT add `with: version:` here — pnpm/action-setup@v4 errors when both are set.
      - uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Vitest Tests
        run: pnpm test

      - name: Run Prettier Format Check
        run: pnpm format:check

      - name: Run Vale Prose Lint
        run: pnpm lint:prose

      - name: Run Slop Scan
        run: pnpm lint:slop

      # bkit ships pre-built (no `prepare: tsc` since v0.3.0). dist/ must be
      # regenerated and committed whenever .agents/scripts/**.ts changes.
      # This step rebuilds dist/ in CI and fails if the working tree differs
      # from the committed version.
      - name: Verify Dist Freshness
        run: pnpm check:dist

      - name: Run Bkit Check
        run: pnpm bkit check
