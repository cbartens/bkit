name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Pnpm version is resolved from the consumer's package.json#packageManager (single SoT).
      # Do NOT add `with: version:` here — pnpm/action-setup@v4 errors when both are set.
      - uses: pnpm/action-setup@v4

      - name: Configure private-repo auth
        run: git config --global url."https://x-access-token:${{ secrets.GH_BKIT_TOKEN }}@github.com/cbartens/bkit/".insteadOf "https://github.com/cbartens/bkit/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check

      - name: Lint prose
        run: pnpm lint:prose

      - name: Lint slop
        run: pnpm lint:slop

      # bkit ships pre-built (no `prepare: tsc` since v0.3.0). dist/ must be
      # regenerated and committed whenever .agents/scripts/**.ts changes.
      # This step rebuilds dist/ in CI and fails if the working tree differs
      # from the committed version.
      - name: Verify dist/ is fresh
        run: pnpm check:dist

      - name: bkit check (informational — bkit-self has intentional template asymmetries)
        run: pnpm bkit check || true
