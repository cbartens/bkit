name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# pull-requests: read lets bkit-tests-scope call repos/{}/commits/{sha}/pulls to tell a
# merged-PR dev push (light) from a direct dev push (full — the uuid-incident fix).
permissions:
  actions: read
  contents: read
  pull-requests: read

# Cancel superseded in-progress runs on the same PR only. Never on push to main/dev —
# release/main-CI runs are observed by downstream workflow_run triggers and must not be cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── bkit-tests-scope ── always-on planner (no `if:`; never skips). Emits the bkit-test-plan
  # JSON read via fromJSON(needs.bkit-tests-scope.outputs.plan).<field> + a $GITHUB_STEP_SUMMARY table.
  # bkit is single-package, no deploy — web_affected/run_e2e/run_live are always false and
  # there's no turbo affected-graph. The full multi-tier decide ships to consumers in
  # .bkit/templates/.github/workflows/ci.yml; this dogfoods the marker + run_level +
  # merged-PR-escalation core. Test lanes (bkit-tests-static, bkit-tests-unit,
  # bkit-tests-integration) run in parallel; the capstone bkit-tests-check needs all three.
  bkit-tests-scope:
    name: bkit-tests-scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
    steps:
      - name: Read Markers
        id: markers
        # User-controlled text (commit message / PR title) arrives via env: (runtime
        # expansion, injection-safe) — never inlined into the run: body.
        env:
          PUSH_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            MSG="$PUSH_MSG"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            MSG="$PR_TITLE"
          else
            MSG=""
          fi
          # [skip ci] / [skip actions] honoured push-only (commit message). PR-title skip
          # is intentionally ignored — it would bypass the bkit-tests-check required gate.
          SKIP_MSG=""
          [ "$EVENT_NAME" = "push" ] && SKIP_MSG="$MSG"

          MARKERS=""
          case "$MSG" in *"[force build]"*) MARKERS="$MARKERS force-build" ;; esac
          # [force full] (#291) — the consumer-scaffold hammer (full + bypass web_affected →
          # integration + e2e + @live). bkit's own repo is single-package with no deploy /
          # affected-graph, so there is nothing extra to bypass: [force full] is recognised
          # here purely so the marker dogfoods to run_level=full (same as [force build]).
          case "$MSG" in *"[force full]"*) MARKERS="$MARKERS force-full" ;; esac
          case "$MSG" in *"[force cache]"*) MARKERS="$MARKERS force-cache" ;; esac
          case "$MSG" in *"[verbose ci]"*) MARKERS="$MARKERS verbose-ci" ;; esac
          case "$SKIP_MSG" in *"[skip ci]"*) MARKERS="$MARKERS skip-ci" ;; esac
          case "$SKIP_MSG" in *"[skip actions]"*) MARKERS="$MARKERS skip-ci" ;; esac

          MARKERS=$(echo "$MARKERS" | xargs)
          MARKERS_JSON=$(echo "$MARKERS" | tr ' ' '\n' | jq -R -s -c 'split("\n") | map(select(length > 0))' 2>/dev/null || echo "[]")
          echo "markers_present=$MARKERS_JSON" >> "$GITHUB_OUTPUT"
          echo "Markers detected: $MARKERS_JSON"

      - name: Decide Run Level
        id: level
        env:
          GH_TOKEN: ${{ github.token }}
          MARKERS: ${{ steps.markers.outputs.markers_present }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Compute into shell vars, then write once at the end. A single grouped
          # redirect avoids SC2129 (bkit's actionlint runs with no suppress config).
          RUN_LEVEL=""
          DEPTH_SOURCE=""
          WHETHER_REASON=""

          HAS_SKIP=$(echo "$MARKERS" | jq 'any(.[]; . == "skip-ci")' 2>/dev/null || echo "false")
          HAS_FORCE_BUILD=$(echo "$MARKERS" | jq 'any(.[]; . == "force-build")' 2>/dev/null || echo "false")
          HAS_FORCE_FULL=$(echo "$MARKERS" | jq 'any(.[]; . == "force-full")' 2>/dev/null || echo "false")

          if [ "$HAS_SKIP" = "true" ]; then
            # Layer 1 — [skip ci] wins: do not run. Hard veto over any force marker (#291).
            RUN_LEVEL="none"; DEPTH_SOURCE="marker:skip-ci"; WHETHER_REASON="skipped-because:skip-ci-marker"
            echo "🛑 [skip ci] → run_level=none"
          elif [ "$HAS_FORCE_BUILD" = "true" ] || [ "$HAS_FORCE_FULL" = "true" ]; then
            # Layer 2 — how much to run. [force build] / [force full] both escalate to full
            # here; in a deploy-bearing consumer scaffold [force full] additionally bypasses
            # web_affected (integration + e2e + @live) — bkit's own repo has no such tiers.
            if [ "$HAS_FORCE_FULL" = "true" ]; then
              RUN_LEVEL="full"; DEPTH_SOURCE="marker:force-full"; WHETHER_REASON="ran-because:force-full"
              echo "✅ [force full] → run_level=full"
            else
              RUN_LEVEL="full"; DEPTH_SOURCE="marker:force-build"; WHETHER_REASON="ran-because:force-build"
              echo "✅ [force build] → run_level=full"
            fi
          elif [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RUN_LEVEL="full"; DEPTH_SOURCE="event:$EVENT_NAME"; WHETHER_REASON="ran-because:$EVENT_NAME"
            echo "✅ $EVENT_NAME → run_level=full"
          elif [ "$REF" = "refs/heads/main" ]; then
            RUN_LEVEL="full"; DEPTH_SOURCE="main-carveout"; WHETHER_REASON="ran-because:push-main"
            echo "✅ push main → run_level=full (main-carveout)"
          elif [ "$REF" = "refs/heads/dev" ]; then
            # Merged-PR dev push (PR already ran full) → light. Direct dev push with no
            # merged PR behind it → escalate to full (kills the uuid-incident at source).
            # API error → full (run-to-be-safe).
            set +e
            PR_RESPONSE=$(gh api "repos/$REPO/commits/$SHA/pulls" 2>&1)
            GH_EC=$?
            set -e
            if [ "$GH_EC" -ne 0 ]; then
              echo "::warning::commits/{sha}/pulls failed (exit $GH_EC) — defaulting to full (run-to-be-safe)"
              RUN_LEVEL="full"; DEPTH_SOURCE="fallback-on-api-error"; WHETHER_REASON="ran-because:dev-push-api-error"
            else
              MERGED_PR=$(echo "$PR_RESPONSE" | jq -r '.[0].number // empty' 2>/dev/null || echo "")
              if [ -n "$MERGED_PR" ]; then
                RUN_LEVEL="light"; DEPTH_SOURCE="auto-via-gh-api"; WHETHER_REASON="ran-because:dev-push-merged-pr-$MERGED_PR"
                echo "✅ dev push: merged PR #$MERGED_PR → run_level=light"
              else
                RUN_LEVEL="full"; DEPTH_SOURCE="auto-via-gh-api"; WHETHER_REASON="ran-because:dev-push-direct-escalated"
                echo "✅ dev push: no merged PR (direct) → run_level=full (escalated)"
              fi
            fi
          else
            # Other refs (non-dev, non-main push).
            RUN_LEVEL="light"; DEPTH_SOURCE="event:push"; WHETHER_REASON="ran-because:push-other-ref"
          fi

          {
            echo "run_level=$RUN_LEVEL"
            echo "source=$DEPTH_SOURCE"
            echo "reason=$WHETHER_REASON"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Test Plan
        id: scope
        # Prior-step outputs arrive via env: so JSON-array values keep their inner quotes
        # (a double-quoted "${{ ...json... }}" in the run body would corrupt --argjson).
        env:
          RUN_LEVEL: ${{ steps.level.outputs.run_level }}
          DEPTH_SOURCE: ${{ steps.level.outputs.source }}
          WHETHER_REASON: ${{ steps.level.outputs.reason }}
          MARKERS: ${{ steps.markers.outputs.markers_present }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          # bkit is single-package with no deploy: web_affected / run_e2e /
          # run_live / global_dep_changed are constant false. The fields stay in
          # the contract so the bkit-test-plan schema is identical to the consumer template.
          PLAN_JSON=$(jq -cn \
            --arg schema "bkit-test-plan" \
            --arg run_level "${RUN_LEVEL:-none}" \
            --argjson web_affected false \
            --argjson run_e2e false \
            --argjson run_live false \
            --argjson global_dep_changed false \
            --arg source "${DEPTH_SOURCE:-none}" \
            --arg reason "${WHETHER_REASON:-}" \
            --arg event "$EVENT_NAME" \
            --arg ref "$REF" \
            --argjson affected_packages '[]' \
            --argjson markers_present "${MARKERS:-[]}" \
            '{
              schema: $schema,
              run_level: $run_level,
              web_affected: $web_affected,
              run_e2e: $run_e2e,
              run_live: $run_live,
              global_dep_changed: $global_dep_changed,
              source: $source,
              reason: $reason,
              event: $event,
              ref: $ref,
              affected_packages: $affected_packages,
              markers_present: $markers_present
            }')

          # has()/!=null (NOT `.field // empty`): jq's // treats boolean false as absent,
          # so a legit run_live:false would read as a missing required field.
          FAIL=0
          for field in schema run_level web_affected run_e2e run_live source reason; do
            if ! echo "$PLAN_JSON" | jq -e --arg f "$field" 'has($f) and .[$f] != null' >/dev/null 2>&1; then
              echo "::error::Plan JSON missing required field: $field"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "::error::Plan JSON failed schema validation"
            exit 1
          fi

          echo "plan=$(echo "$PLAN_JSON" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "Plan JSON: $(echo "$PLAN_JSON" | jq -c .)"

      - name: Upload Test Plan
        if: "!cancelled()"
        env:
          PLAN: ${{ steps.scope.outputs.plan }}
        run: |
          RUN_LEVEL=$(echo "$PLAN" | jq -r '.run_level')
          DEPTH=$(echo "$PLAN" | jq -r '.source')
          WHETHER=$(echo "$PLAN" | jq -r '.reason')
          MARKERS=$(echo "$PLAN" | jq -r '.markers_present | join(", ")' 2>/dev/null || echo "")
          {
            echo "## CI Plan — \`bkit-tests-scope\` (single-package, no deploy/e2e/live)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| schema | bkit-test-plan |"
            echo "| run_level | \`$RUN_LEVEL\` |"
            echo "| source | \`$DEPTH\` |"
            echo "| reason | \`$WHETHER\` |"
            echo "| markers | ${MARKERS:-none} |"
            echo ""
            if [ "$RUN_LEVEL" = "none" ]; then
              echo "> ⏭️ **bkit-tests-static + bkit-tests-unit skipped** — $WHETHER"
            else
              echo "> ✅ **bkit-tests-static + bkit-tests-unit run** (run_level=\`$RUN_LEVEL\`); web / e2e / live tiers are N/A for bkit."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write Cancellation Notice
        if: cancelled()
        run: |
          {
            echo "## CI Plan — bkit-tests-scope (CANCELLED)"
            echo ""
            echo "> ⚠️ Run cancelled before the plan-table could be written (concurrency cancel-in-progress)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── bkit-tests-static ─────────────────────────────────────────────────────
  # Static-analysis lane: typecheck, format, prose lint, slop, actionlint,
  # dist-freshness, bkit check. Runs on a CLEAN tree (no test artifacts).
  # Parallel sibling of bkit-tests-unit — wall-clock = MAX(lane).
  bkit-tests-static:
    name: bkit-tests-static
    needs: [bkit-tests-scope]
    if: fromJSON(needs.bkit-tests-scope.outputs.plan).run_level != 'none'
    runs-on: ubuntu-latest
    outputs:
      cache_skip: ${{ steps.cache.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so slop:delta can materialise the PR base ref as a worktree.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Pnpm version is resolved from the consumer's package.json#packageManager (single SoT).
      # Do NOT add `with: version:` here — pnpm/action-setup errors when both are set.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Check SHA Cache
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.bkit-tests-scope.outputs.plan }}
        run: |
          SKIP="false"
          FORCE=$(echo "$PLAN" | jq -r '(.markers_present // []) | any(.[]; . == "force-build" or . == "force-cache")' 2>/dev/null || echo "false")
          if [ "$FORCE" = "true" ]; then
            echo "::notice::force marker present — ignoring SHA cache."
          else
            SINCE=$(date -u -d '7 days ago' +%FT%TZ 2>/dev/null || date -u -v -7d +%FT%TZ)
            PRIOR=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$GITHUB_WORKFLOW" \
              --status success \
              --limit 50 \
              --json headSha,createdAt \
              --jq "[.[] | select(.headSha == \"$GITHUB_SHA\") | select(.createdAt > \"$SINCE\")] | length" \
              2>/dev/null || echo 0)
            if [ "${PRIOR:-0}" -gt 0 ]; then
              SKIP="true"
              echo "::notice::SHA $GITHUB_SHA has $PRIOR prior green run(s) since $SINCE — skipping suite."
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      # Promotion-lag reminder (non-blocking). Renovate reads its config ONLY from the default
      # branch, and scheduled / default-branch-triggered Actions run the default branch's copy
      # of each workflow — so a renovate.json5 or .github/workflows/ edit that lands on dev but
      # is never promoted runs STALE until a dev -> default branch PR lands. CI on dev proves
      # the code; nothing otherwise checks it reached the default branch. Warns (never fails) on
      # dev pushes when those consumed-from-default-branch surfaces differ. Faithfully dogfoods
      # the consumer scaffold's `main-lag-warning` block (kept marker-free here — bkit's own
      # ci.yml is intentionally degenerate, not the shipped scaffold). See docs/deployments.md
      # § "Promotion-lag warning".
      - name: Check Main Lags Dev
        if: steps.cache.outputs.skip != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$DEFAULT_BRANCH" = "dev" ]; then
            echo "::notice::promotion-lag check skipped (default branch is '$DEFAULT_BRANCH')"
            exit 0
          fi
          if ! git fetch --no-tags --quiet origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" 2>/dev/null; then
            echo "::notice::promotion-lag check skipped — could not fetch $DEFAULT_BRANCH"
            exit 0
          fi
          SURFACES=(.github/renovate.json5 .github/renovate.json .github/workflows)
          STALE=$(git diff --name-only "origin/$DEFAULT_BRANCH" HEAD -- "${SURFACES[@]}" 2>/dev/null || true)
          if [ -z "$STALE" ]; then
            echo "consumed-from-$DEFAULT_BRANCH surfaces match $DEFAULT_BRANCH — nothing stale to promote."
            exit 0
          fi
          BEHIND=$(git rev-list --count "origin/$DEFAULT_BRANCH..HEAD" 2>/dev/null || echo "?")
          {
            echo "### WARNING: $DEFAULT_BRANCH is serving stale consumed surfaces"
            echo ""
            echo "\`$DEFAULT_BRANCH\` is **$BEHIND commit(s)** behind \`dev\`, and these files — which Renovate and scheduled / default-branch Actions read LIVE from \`$DEFAULT_BRANCH\` — differ from \`dev\`:"
            echo ""
            printf '%s\n' "$STALE" | sed 's/^/- /'
            echo ""
            echo "They run the **$DEFAULT_BRANCH** version until promoted. Open a \`dev\` -> \`$DEFAULT_BRANCH\` PR to apply them."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::$DEFAULT_BRANCH is $BEHIND commit(s) behind dev and consumed-from-$DEFAULT_BRANCH surfaces (Renovate config / workflows) differ — they run STALE until you promote dev -> $DEFAULT_BRANCH. See the run summary."

      - name: Install Dependencies
        if: steps.cache.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        if: steps.cache.outputs.skip != 'true'
        run: pnpm typecheck

      - name: Run Prettier Format Check
        if: steps.cache.outputs.skip != 'true'
        run: pnpm format:check

      # vale is not on the runner and .vale/styles/ is gitignored, so without this step
      # `pnpm lint:prose` guard-skips (write-good missing) and the prose gate is silently
      # dead. Pinned tarball + `vale sync` (matches .cursor/Dockerfile / docs/setup.md).
      - name: Install Vale
        if: steps.cache.outputs.skip != 'true'
        env:
          VALE_VERSION: "3.9.1"
          # sha256 of vale_${VALE_VERSION}_Linux_64-bit.tar.gz (from the release's checksums.txt).
          # Bump alongside VALE_VERSION; verified before extract so a tampered/CDN-swapped tarball fails closed.
          VALE_SHA256: "fbc2eb47d0b8c50220ed1a2c5c611fbe0904ed567d638143d482016a18fd2db0"
        run: |
          curl -fsSL --retry 3 --retry-all-errors "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o "$RUNNER_TEMP/vale.tar.gz"
          echo "${VALE_SHA256}  $RUNNER_TEMP/vale.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          # vale sync pulls styles (write-good) from GitHub — retry to survive a transient CDN/network blip.
          for i in 1 2 3; do
            "$RUNNER_TEMP/vale" sync && break
            [ "$i" = 3 ] && { echo "::error::vale sync failed after 3 attempts"; exit 1; }
            echo "::warning::vale sync attempt $i failed — retrying in 5s"; sleep 5
          done

      - name: Run Vale Prose Lint
        if: steps.cache.outputs.skip != 'true'
        run: pnpm lint:prose

      - name: Run Slop Scan
        if: steps.cache.outputs.skip != 'true'
        run: pnpm lint:slop

      # The ENFORCING slop gate (lint:slop above is an advisory full-scan that never fails).
      # PR-only: materialises the PR base as a worktree and fails on findings this PR ADDS or
      # WORSENS vs base. Needs fetch-depth: 0 (set on checkout) so the base SHA is present.
      - name: Run Slop Delta
        if: steps.cache.outputs.skip != 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm slop:delta "$BASE_SHA"

      # actionlint validates .github/workflows/* with GitHub-Actions-aware rules
      # (${{ }} expression syntax, shellcheck on run: blocks). A YAML linter accepts
      # workflows that are valid YAML but invalid GHA; actionlint catches that class.
      - name: Run Actionlint
        if: steps.cache.outputs.skip != 'true'
        run: |
          # Script pinned to the v1.7.12 commit SHA (the git tag is mutable/forgeable); the binary version
          # is pinned separately via the 1.7.12 arg passed to the script below.
          curl -sSfL --retry 3 --retry-all-errors https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash -o "$RUNNER_TEMP/download-actionlint.bash"
          # download-actionlint.bash fetches the binary from GitHub releases — retry to survive a transient CDN/network blip.
          for i in 1 2 3; do
            bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.12 "$RUNNER_TEMP" && break
            [ "$i" = 3 ] && { echo "::error::actionlint download failed after 3 attempts"; exit 1; }
            echo "::warning::actionlint download attempt $i failed — retrying in 5s"; sleep 5
          done
          "$RUNNER_TEMP/actionlint" -color

      # bkit ships pre-built (no `prepare: tsc` since v0.3.0). dist/ must be
      # regenerated and committed whenever .bkit/src/**.ts changes.
      # This step rebuilds dist/ in CI and fails if the working tree differs
      # from the committed version.
      - name: Verify Dist Freshness
        if: steps.cache.outputs.skip != 'true'
        run: pnpm check:dist

      - name: Run Bkit Check
        if: steps.cache.outputs.skip != 'true'
        run: pnpm bkit check

      # Tier-3 status-hole detector — ADVISORY, fail-open (the CLI exits 0 even
      # when it finds holes). Decision 384-tier3-promotion gates promotion to a
      # blocking gate on one release of fail-open signal without muting; that
      # signal only accrues if something actually runs it, so it runs here.
      # `|| true` is belt-and-braces: the CLI's own contract is exit 0 always.
      - name: Status-Hole Detector (advisory)
        if: steps.cache.outputs.skip != 'true'
        run: pnpm audit:status-holes || true

  # ── bkit-tests-unit ──────────────────────────────────────────────────────
  # Unit-test lane: vitest only. Parallel sibling of bkit-tests-static —
  # wall-clock = MAX(lane). Emits tests_ran for the non-hollow capstone check.
  bkit-tests-unit:
    name: bkit-tests-unit
    needs: [bkit-tests-scope]
    if: fromJSON(needs.bkit-tests-scope.outputs.plan).run_level != 'none'
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow-level block (they are not additive). The
    # coverage report step needs pull-requests: write to post its PR comment; the Check SHA
    # Cache step calls `gh run list`, so actions: read must be re-declared here or it breaks.
    permissions:
      actions: read
      contents: read
      pull-requests: write
    outputs:
      cache_skip: ${{ steps.cache.outputs.skip }}
      tests_ran: ${{ steps.vitest.outputs.ran }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Check SHA Cache
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.bkit-tests-scope.outputs.plan }}
        run: |
          SKIP="false"
          FORCE=$(echo "$PLAN" | jq -r '(.markers_present // []) | any(.[]; . == "force-build" or . == "force-cache")' 2>/dev/null || echo "false")
          if [ "$FORCE" = "true" ]; then
            echo "::notice::force marker present — ignoring SHA cache."
          else
            SINCE=$(date -u -d '7 days ago' +%FT%TZ 2>/dev/null || date -u -v -7d +%FT%TZ)
            PRIOR=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$GITHUB_WORKFLOW" \
              --status success \
              --limit 50 \
              --json headSha,createdAt \
              --jq "[.[] | select(.headSha == \"$GITHUB_SHA\") | select(.createdAt > \"$SINCE\")] | length" \
              2>/dev/null || echo 0)
            if [ "${PRIOR:-0}" -gt 0 ]; then
              SKIP="true"
              echo "::notice::SHA $GITHUB_SHA has $PRIOR prior green run(s) since $SINCE — skipping suite."
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        if: steps.cache.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      # UNIT coverage run. The gate command itself — scoped via --coverage.include to the logic
      # surface (all .bkit/src except the bkit-modules data registry, exercised end-to-end not
      # unit-tested; vitest coverage is per-RUN not per-project, so scoping is a CLI flag) with the
      # branch-coverage floor --coverage.thresholds.branches (set just below current, ratcheted up)
      # that reds the lane on a regression — lives in the `test:coverage:unit` package.json script.
      # SINGLE SOURCE: the /bkit-build pre-PR gate runs the SAME script (bkit-build.md Step 13), so a
      # coverage drop fails in the worktree before this lane ever sees it; bump the threshold in
      # package.json and both callers move together. This step only appends the JSON test reporter +
      # outputFile for the executed-count below. Its parallel sibling bkit-tests-integration owns the
      # integration tier (report-only) — SEPARATE lanes so each tier has its own honest number and
      # executed-count, mirroring how consumers (gether/fraser) run them. Dogfoods the per-tier
      # bkit-stub:coverage scaffold shipped to consumers. See testing.md § Coverage on PRs.
      - name: Run Vitest Unit Tests
        id: vitest
        if: steps.cache.outputs.skip != 'true'
        run: |
          pnpm test:coverage:unit \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/unit-result.json"
          UNIT_RAN=$(jq '[.numPassedTests, .numFailedTests] | add' "$RUNNER_TEMP/unit-result.json")
          echo "ran=$UNIT_RAN" >> "$GITHUB_OUTPUT"
          echo "::notice::vitest executed $UNIT_RAN unit test(s)."

      # Shell-level tests (bats) for the counter-bus retry-gating helpers and the telemetry
      # fail-open contract — logic vitest can't reach (they source .bkit/scripts/*.sh). jq is
      # preinstalled on ubuntu-latest; bats-core comes from npm via npx.
      - name: Run Shell Tests (bats)
        if: steps.cache.outputs.skip != 'true'
        run: npx --yes bats tests/*.bats

      # Unit coverage comment on PRs (the COMMENT step never fails the lane; the unit RUN above gates
      # branches via --coverage.thresholds.branches). A distinct name: keys the sticky comment so the
      # unit / integration comments don't collide. The head.repo == repo guard skips fork PRs, where
      # GITHUB_TOKEN is read-only and the comment would fail.
      - name: Report Unit Coverage on PR
        if: steps.cache.outputs.skip != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          name: unit
          json-summary-path: coverage/unit/coverage-summary.json
          json-final-path: coverage/unit/coverage-final.json
          file-coverage-mode: changes
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── bkit-tests-integration ── parallel sibling of static + unit (SEPARATE lane, matching how
  # consumers gether/fraser run it). Owns the integration tier: runs *.integration.test.ts and
  # reports integration coverage scoped to the engine surface (modules/install/upgrade/uninstall).
  # REPORT-ONLY — no --coverage.thresholds (gated on EXECUTION via the capstone's integration_ran > 0,
  # not a %): a hard integration % punishes the correct pyramid shape (testing.md § Coverage on PRs).
  bkit-tests-integration:
    name: bkit-tests-integration
    needs: [bkit-tests-scope]
    if: fromJSON(needs.bkit-tests-scope.outputs.plan).run_level != 'none'
    runs-on: ubuntu-latest
    # Same job-level permissions rationale as bkit-tests-unit: pull-requests: write for the coverage
    # comment; actions: read for the SHA-cache `gh run list`.
    permissions:
      actions: read
      contents: read
      pull-requests: write
    outputs:
      cache_skip: ${{ steps.cache.outputs.skip }}
      tests_ran: ${{ steps.vitest.outputs.ran }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Check SHA Cache
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.bkit-tests-scope.outputs.plan }}
        run: |
          SKIP="false"
          FORCE=$(echo "$PLAN" | jq -r '(.markers_present // []) | any(.[]; . == "force-build" or . == "force-cache")' 2>/dev/null || echo "false")
          if [ "$FORCE" = "true" ]; then
            echo "::notice::force marker present — ignoring SHA cache."
          else
            SINCE=$(date -u -d '7 days ago' +%FT%TZ 2>/dev/null || date -u -v -7d +%FT%TZ)
            PRIOR=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$GITHUB_WORKFLOW" \
              --status success \
              --limit 50 \
              --json headSha,createdAt \
              --jq "[.[] | select(.headSha == \"$GITHUB_SHA\") | select(.createdAt > \"$SINCE\")] | length" \
              2>/dev/null || echo 0)
            if [ "${PRIOR:-0}" -gt 0 ]; then
              SKIP="true"
              echo "::notice::SHA $GITHUB_SHA has $PRIOR prior green run(s) since $SINCE — skipping suite."
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        if: steps.cache.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      # INTEGRATION coverage run, scoped via --coverage.include to the engine surface
      # (modules/install/upgrade/uninstall) so the number reflects the flows integration is meant to
      # drive, not a whole-repo denominator. Report-only — NO --coverage.thresholds (see job header).
      - name: Run Vitest Integration Tests
        id: vitest
        if: steps.cache.outputs.skip != 'true'
        run: |
          pnpm exec vitest run --coverage --coverage.reportsDirectory=coverage/integration \
            integration.test \
            --coverage.include='.bkit/src/bkit-{modules,install,upgrade,uninstall}.ts' \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/int-result.json"
          INT_RAN=$(jq '[.numPassedTests, .numFailedTests] | add' "$RUNNER_TEMP/int-result.json")
          echo "ran=$INT_RAN" >> "$GITHUB_OUTPUT"
          echo "::notice::vitest executed $INT_RAN integration test(s)."

      - name: Report Integration Coverage on PR
        if: steps.cache.outputs.skip != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          name: integration
          json-summary-path: coverage/integration/coverage-summary.json
          json-final-path: coverage/integration/coverage-final.json
          file-coverage-mode: changes
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── bkit-tests-check ── capstone; needs ALL test lanes; if: !cancelled() (NOT always() — a
  # concurrency-cancel must not stamp a bogus failure that blocks release PRs; failure() is not
  # cancelled(), so real failures still fail loudly). Asserts the plan was honoured: bkit-tests-scope
  # succeeded and, when run_level != none, ALL THREE test lanes (static / unit / integration)
  # succeeded AND unit + integration each executed >0 tests (not a vacuous green). bkit's SOLE
  # branch-protection required check (.bkit/scripts/bkit-protect-main.sh, REQUIRED_JOB=bkit-tests-check)
  # — green means "the planned suite ran and passed", not "nothing visibly failed".
  # NAMESPACE NOTE: bkit-tests-scope is the PLANNER, not a test lane, but it lives in the
  # bkit-tests-* namespace. Its SCOPE_RESULT assertion below is what makes it non-hollow — it is
  # NOT covered by the per-lane result/*_ran loop. Any guard that treats every bkit-tests-* job as
  # a lane must exempt it BY NAME and point at that assertion, or a scope failure goes unasserted
  # and the capstone stays green.
  bkit-tests-check:
    name: bkit-tests-check
    needs: [bkit-tests-scope, bkit-tests-static, bkit-tests-unit, bkit-tests-integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Test Plan Followed
        env:
          PLAN: ${{ needs.bkit-tests-scope.outputs.plan }}
          SCOPE_RESULT: ${{ needs.bkit-tests-scope.result }}
          STATIC_RESULT: ${{ needs.bkit-tests-static.result }}
          UNIT_RESULT: ${{ needs.bkit-tests-unit.result }}
          UNIT_RAN: ${{ needs.bkit-tests-unit.outputs.tests_ran }}
          UNIT_CACHE_SKIP: ${{ needs.bkit-tests-unit.outputs.cache_skip }}
          INTEGRATION_RESULT: ${{ needs.bkit-tests-integration.result }}
          INTEGRATION_RAN: ${{ needs.bkit-tests-integration.outputs.tests_ran }}
          INTEGRATION_CACHE_SKIP: ${{ needs.bkit-tests-integration.outputs.cache_skip }}
        run: |
          FAIL=0
          plan_run_level=$(echo "$PLAN" | jq -r '.run_level' 2>/dev/null || echo "")
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "::error::bkit-tests-scope did not succeed (result=$SCOPE_RESULT)"
            FAIL=1
          fi
          if [ "$plan_run_level" != "none" ] && [ "$STATIC_RESULT" != "success" ]; then
            echo "::error::plan.run_level=$plan_run_level but bkit-tests-static result=$STATIC_RESULT"
            FAIL=1
          fi
          if [ "$plan_run_level" != "none" ] && [ "$UNIT_RESULT" != "success" ]; then
            echo "::error::plan.run_level=$plan_run_level but bkit-tests-unit result=$UNIT_RESULT"
            FAIL=1
          fi
          if [ "$plan_run_level" != "none" ] && [ "$INTEGRATION_RESULT" != "success" ]; then
            echo "::error::plan.run_level=$plan_run_level but bkit-tests-integration result=$INTEGRATION_RESULT"
            FAIL=1
          fi
          # NON-HOLLOW: a real run (not a SHA-cache short-circuit) of a test lane must have executed
          # >0 tests — guards the green-with-zero hole (vitest exiting 0 having run nothing:
          # --passWithNoTests / glob drift / all-skipped). cache_skip=true was already validated on
          # the cached SHA, and run_level=none is a deliberate skip — both assert nothing. Checked
          # PER LANE (unit + integration) so a hollow either-tier is caught.
          assert_ran() {
            lane="$1"; ran="$2"
            case "$ran" in
              ''|*[!0-9]*)
                echo "::error::$lane succeeded but its executed-test count is non-numeric ('$ran') — cannot confirm tests ran."
                FAIL=1 ;;
              0)
                echo "::error::$lane succeeded but executed 0 tests — vacuous green (expected >0)."
                FAIL=1 ;;
            esac
          }
          if [ "$plan_run_level" != "none" ] && [ "$UNIT_RESULT" = "success" ] && [ "$UNIT_CACHE_SKIP" != "true" ]; then
            assert_ran "bkit-tests-unit" "$UNIT_RAN"
          fi
          if [ "$plan_run_level" != "none" ] && [ "$INTEGRATION_RESULT" = "success" ] && [ "$INTEGRATION_CACHE_SKIP" != "true" ]; then
            assert_ran "bkit-tests-integration" "$INTEGRATION_RAN"
          fi
          if [ "$FAIL" = "1" ]; then
            echo "::error::bkit-tests-check FAILED — plan was not honoured. See above."
            exit 1
          fi
          echo "✅ bkit-tests-check passed — planned suite ran (static=$STATIC_RESULT, unit=${UNIT_RAN:-cache-skip/none}, integration=${INTEGRATION_RAN:-cache-skip/none} tests) and succeeded (run_level=$plan_run_level)."

# ─────────────────────────────────────────────────────────────────────────────
# CONSUMER SCAFFOLD (not used by bkit). bkit ships the FULL multi-tier scaffold to
# consumers in .bkit/templates/.github/workflows/ci.yml as `# bkit-stub:` blocks they
# enable: turbo affected-graph (bkit-tests-scope); integration + E2E + Vercel-await; the
# push-only @live job (bkit-tests-live) — all N/A for single-package, no-deploy bkit.
# bkit's own CI splits into parallel lanes (bkit-tests-static + bkit-tests-unit +
# bkit-tests-integration) to dogfood the SEPARATE-lane-per-tier pattern consumers run
# (gether/fraser); e2e/migrate/live lanes are template-only (bkit has no browser/DB/deploy).
# `pnpm bkit install`/`upgrade` advise on each stub. See .bkit/src/bkit-postinstall.ts.
# ─────────────────────────────────────────────────────────────────────────────
