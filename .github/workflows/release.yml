name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release and push the sliding v{N} major-version tag
  id-token: write # OIDC trusted publishing — the npmjs publish uses no long-lived token

# Prevent two publish runs racing against the same tag. cancel-in-progress: false
# is deliberate — killing a mid-flight registry publish is unsafe; the duplicate run
# will simply fail with "cannot publish over existing version" (expected, not a regression).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # No `environment:` approval. The publish gate is `main` itself: a tag publishes only when
    # its commit is already on `main`, and `main` takes only PR merges that passed
    # `bkit-tests-check` (`bkit setup protect-main`). The npmjs publish authenticates with OIDC
    # trusted publishing (id-token: write) and no long-lived token. If a second maintainer is
    # ever onboarded, add `environment: production` here and enable required-reviewer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + origin/main for the on-main check below

      # A tag on a commit that never reached `main` (any branch, or a detached commit) would
      # otherwise publish code that skipped the PR and the required check.
      - name: Require the tagged commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; only commits merged to main publish"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # >= 22.14 ships npm >= 11.5.1, the floor for OIDC trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@cbartens'

      # Pnpm version is resolved from package.json#packageManager (single SoT).
      # Do NOT add `with: version:` here — pnpm/action-setup@v4 errors when both are set.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check

      - name: Lint prose
        run: pnpm lint:prose

      - name: Lint slop
        run: pnpm lint:slop

      - name: Verify dist/ is fresh
        run: pnpm bkit:check:dist

      # Notes = this tag's CHANGELOG.md block minus `---` separators; empty → fail before publish.
      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && $0 != "---" { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' block with content"
            exit 1
          fi
          printf '\n---\n\nnpm: [@cbartens/bkit@%s](https://www.npmjs.com/package/@cbartens/bkit/v/%s)\n' "$VERSION" "$VERSION" >> "$RUNNER_TEMP/notes.md"

      # OIDC trusted publishing: no token env — the npm CLI exchanges the id-token for a
      # short-lived publish token. npmjs.com → package → Settings → Trusted publishing
      # names this workflow file (release.yml). --provenance attaches the signed build
      # attestation linking the tarball to this repo + run (needs a public repo).
      - name: Publish to npmjs
        run: npm publish --provenance

      # After publish. Prerelease tags (containing `-`) → marked prerelease, never "Latest".
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" $PRERELEASE

      # Slides v{N} (e.g. `v1`) to point at the latest v{N}.x.y after a successful publish.
      # Matches the GitHub Actions community convention (actions/checkout@v4 etc.) so
      # consumers pin @v1 and receive non-breaking patches automatically. See
      # docs/deployments.md § "Sliding major-version tag" for the rationale.
      # Skipped for prerelease tags (anything containing `-`, e.g. v1.0.3-rc.1) — those
      # remain immutable and never re-point a sliding tag.
      - name: Update sliding major-version tag
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          MAJOR="v$(echo '${{ github.ref_name }}' | sed -E 's/^v([0-9]+)\..*/\1/')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "${{ github.ref_name }}"
          git push origin "$MAJOR" --force
          echo "Sliding tag $MAJOR now points at ${{ github.ref_name }}"
