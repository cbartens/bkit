name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to push the sliding v{N} major-version tag (see step "Update sliding major-version tag")
  packages: write

# Prevent two publish runs racing against the same tag. cancel-in-progress: false
# is deliberate — killing a mid-flight registry publish is unsafe; the duplicate run
# will simply fail with "cannot publish over existing version" (expected, not a regression).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # No `environment:` protection is intentional for a single-maintainer project.
    # Anyone with tag-push permission can trigger a publish; GITHUB_TOKEN is scoped to
    # packages: write above. If a second maintainer is ever onboarded, add
    # `environment: production` here and enable required-reviewer in repo settings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@cbartens'

      # Pnpm version is resolved from package.json#packageManager (single SoT).
      # Do NOT add `with: version:` here — pnpm/action-setup@v4 errors when both are set.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check

      - name: Lint prose
        run: pnpm lint:prose

      - name: Lint slop
        run: pnpm lint:slop

      - name: Verify dist/ is fresh
        run: pnpm check:dist

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Slides v{N} (e.g. `v1`) to point at the latest v{N}.x.y after a successful publish.
      # Matches the GitHub Actions community convention (actions/checkout@v4 etc.) so
      # consumers pin @v1 and receive non-breaking patches automatically. See
      # docs/deployments.md § "Sliding major-version tag" for the rationale.
      # Skipped for prerelease tags (anything containing `-`, e.g. v1.0.3-rc.1) — those
      # remain immutable and never re-point a sliding tag.
      - name: Update sliding major-version tag
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          MAJOR="v$(echo '${{ github.ref_name }}' | sed -E 's/^v([0-9]+)\..*/\1/')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "${{ github.ref_name }}"
          git push origin "$MAJOR" --force
          echo "Sliding tag $MAJOR now points at ${{ github.ref_name }}"
