# Example self-hosted Renovate runner. Copy it to `.github/workflows/bkit-renovate.yml`
# and own it.
# bkit install does not write this file and does not overwrite a copy.
# Rules live in `.github/renovate.json5` (Renovate clones the repo and reads that file).
#
# Runs `renovatebot/github-action` on `ubuntu-latest` (~16 GB).
# Edit `runs-on` yourself (a GitHub larger runner, a Depot label, or a self-hosted
# alias). Keep ≥16 GB of headroom.
#
# MUTUAL EXCLUSION: suspend the Mend Renovate App for this repo, or both open the
# same `renovate/*` PRs. GitHub UI → Settings → Applications → Renovate → Configure
# → remove this repo. No `gh api` equivalent.
#
# SHA-pin the action. This file is yours, so Renovate may bump the pin. Do NOT add
# this path to renovate.json5 `ignorePaths`.
name: Renovate

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level (info | debug)"
        required: false
        default: "info"
        type: string
      dryRun:
        description: "Dry-run mode (full | null)"
        required: false
        default: "null"
        type: string
  schedule:
    # Wake the bot once a day, at an off-hour minute. Renovate's OWN schedule in
    # renovate.json5 ("before 6am on Monday") gates when normal update PRs open;
    # osvVulnerabilityAlerts CVE PRs bypass it and open on the next daily wake.
    # Do NOT narrow this cron to Monday-only.
    - cron: "17 6 * * *"

# Least privilege: Renovate authenticates EVERY GitHub operation with BKIT_GH_TOKEN
# below (a fine-grained or classic PAT, or an App token — NOT GITHUB_TOKEN). The job GITHUB_TOKEN
# needs no write scope.
permissions:
  contents: read

# Serialise runs — one Renovate process at a time on the renovate/* branches and the
# Dependency Dashboard issue. Queue, never cancel.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest # ~16 GB. Edit this label in your copy.
    timeout-minutes: 30
    steps:
      # No checkout / configurationFile: Renovate clones the repo itself and
      # autodiscovers `.github/renovate.json5` as the repo config from the default
      # branch — the same file Mend reads. (For a MULTI-repo self-hosted bot instead,
      # split a global config.js and pass it via `configurationFile:`.)
      #
      # HARDENING (durable, no annual expiry) — mint a GitHub App token instead of a
      # PAT. Add before this step:
      #   - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      #     id: app-token
      #     with:
      #       app-id: ${{ secrets.RENOVATE_APP_ID }}
      #       private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      # then set `token: ${{ steps.app-token.outputs.token }}` below.
      - uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          # PAT secret (default). FINE-GRAINED repository permissions (this repo):
          #   Contents: Read and write · Pull requests: Read and write ·
          #   Workflows: Read and write (the github-actions manager edits
          #   .github/workflows/* SHAs) · Issues: Read and write (Dependency Dashboard) ·
          #   Dependabot alerts: Read (GitHub's vulnerability feed) · Metadata: Read-only.
          # CLASSIC alternative — when one token must span owners (fine-grained PATs cannot):
          #   scopes `repo` · `workflow` · `security_events` (+ `user:email` for authorship).
          # (Personal-account fine-grained tokens only: Account permission "Email addresses: Read"
          # lets Renovate use your verified email as the git author — org-owned tokens have no
          # such permission, so set RENOVATE_GIT_AUTHOR below instead.)
          token: ${{ secrets.BKIT_GH_TOKEN }}
        env:
          # Scope to THIS repo only — never org-wide autodiscover.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_PLATFORM: github
          # Commit author for Renovate's branches. Optional but recommended on ORG repos:
          # org-owned tokens cannot grant "Email addresses", so Renovate can't
          # read your email and falls back to the Mend bot author (Unverified commits).
          # Set the repo variable RENOVATE_GIT_AUTHOR (Settings -> Secrets and variables ->
          # Actions -> Variables), e.g. `Renovate Bot <renovate@your-domain>`. Leave the
          # variable unset on personal-account repos where the token has Email addresses: Read.
          RENOVATE_GIT_AUTHOR: ${{ vars.RENOVATE_GIT_AUTHOR }}
          # allowedEnv is a GLOBAL-only Renovate option (security): it allow-lists which
          # env-var names the repo config's `env:` block may set. renovate.json5 ships
          # `env: { PNPM_WORKERS, PNPM_MAX_WORKERS }` — without this the config
          # is REJECTED ("Env variable name PNPM_WORKERS is not allowed by this bot's
          # allowedEnv") and Renovate does nothing. Mend allows these via its safeEnv
          # preset; self-hosted must set it explicitly. Glob covers any future PNPM_* var.
          RENOVATE_ALLOWED_ENV: "PNPM_*"
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || 'null' }}
          # This env block declares NO ANTHROPIC_API_KEY / BKIT_LINEAR_API_KEY
          # — the Renovate runner must never see them (docs/security.md § Supply-Chain
          # token isolation). Do not add them.
