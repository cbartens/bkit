# Example. Copy into the repo and own it.
# bkit install does not write this file and does not overwrite a copy.
# The job-level `env:` of bkit-tests-static is where the `[verbose ci]` commit marker is
# read; keep it if you want verbose-CI support.
name: bkit-ci

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  # bkit-tests-scope reads the branch's last green run; the capstone's Mirror Push Run
  # reads the dev push run at the promotion PR head. Both are actions: read.
  actions: read
  contents: read

# One run per branch or pull request. A newer run cancels the older one on every event
# except the default branch, which QUEUES (the template's one-run rule exempts the default
# branch — a release-capable run queues rather than being cancelled mid-flight). A pull
# request keys on its number; a push or dispatch keys on the ref, so a PR and a push to dev
# still overlap. A workflow_run observer sees the latest run on that ref only. A push plans
# against the last green run on the branch, not github.event.before, so a cancelled run's
# changes stay in scope.
# See docs/deployments.md § "One run per branch or pull request".
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── bkit-tests-scope ─────────────────────────────────────────────────────
  # Planner, always on (no `if:`): emits the bkit-test-plan JSON every lane reads via
  # fromJSON(needs.bkit-tests-scope.outputs.plan) plus a $GITHUB_STEP_SUMMARY table.
  # Single package, no deploy: web_affected / run_e2e / run_live are always false.
  bkit-tests-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
    steps:
      # The planner resolves the push diff base against the branch's last green run, which
      # needs git history. fetch-depth: 0 so `merge-base --is-ancestor` reaches that head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read Markers
        id: markers
        # User-controlled text (commit message / PR title) arrives via env: (runtime
        # expansion, injection-safe) — never inlined into the run: body.
        env:
          PUSH_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            MSG="$PUSH_MSG"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            MSG="$PR_TITLE"
          else
            MSG=""
          fi
          # [skip ci] / [skip actions] honoured push-only (commit message). PR-title skip
          # is ignored.
          SKIP_MSG=""
          [ "$EVENT_NAME" = "push" ] && SKIP_MSG="$MSG"

          MARKERS=""
          case "$MSG" in *"[force build]"*) MARKERS="$MARKERS force-build" ;; esac
          # [force full] maps to run_level=full, same as [force build]: no web_affected tier here.
          case "$MSG" in *"[force full]"*) MARKERS="$MARKERS force-full" ;; esac
          case "$MSG" in *"[force cache]"*) MARKERS="$MARKERS force-cache" ;; esac
          case "$MSG" in *"[verbose ci]"*) MARKERS="$MARKERS verbose-ci" ;; esac
          case "$SKIP_MSG" in *"[skip ci]"*) MARKERS="$MARKERS skip-ci" ;; esac
          case "$SKIP_MSG" in *"[skip actions]"*) MARKERS="$MARKERS skip-ci" ;; esac

          MARKERS=$(echo "$MARKERS" | xargs)
          MARKERS_JSON=$(echo "$MARKERS" | tr ' ' '\n' | jq -R -s -c 'split("\n") | map(select(length > 0))' 2>/dev/null || echo "[]")
          echo "markers_present=$MARKERS_JSON" >> "$GITHUB_OUTPUT"
          echo "Markers detected: $MARKERS_JSON"

      # The diff base every delta step uses: a PR against its base branch, a push against the
      # branch's last green run (scripts/ci/lanes/resolve-push-base.mjs — a cancelled push's
      # changes stay in scope), a dispatch against HEAD~1. deployments.md § One run per branch
      # or pull request.
      - name: Resolve Base Ref
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"; SOURCE="pr-base"
          elif [ "$EVENT_NAME" = "push" ]; then
            SOURCE_FILE="$RUNNER_TEMP/push-base-source"
            BASE=$(SOURCE_FILE="$SOURCE_FILE" node scripts/ci/lanes/resolve-push-base.mjs)
            SOURCE=$(cat "$SOURCE_FILE" 2>/dev/null || echo "unknown")
          else
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo ""); SOURCE="dispatch-head~1"
          fi
          {
            echo "base=$BASE"
            echo "source=$SOURCE"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved diff base: ${BASE:-<none>} ($SOURCE)"

      - name: Decide Run Level
        id: level
        env:
          MARKERS: ${{ steps.markers.outputs.markers_present }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          # Compute into shell vars, then write once at the end. A single grouped
          # redirect avoids SC2129 (bkit's actionlint runs with no suppress config).
          RUN_LEVEL=""
          DEPTH_SOURCE=""
          WHETHER_REASON=""

          HAS_SKIP=$(echo "$MARKERS" | jq 'any(.[]; . == "skip-ci")' 2>/dev/null || echo "false")
          HAS_FORCE_BUILD=$(echo "$MARKERS" | jq 'any(.[]; . == "force-build")' 2>/dev/null || echo "false")
          HAS_FORCE_FULL=$(echo "$MARKERS" | jq 'any(.[]; . == "force-full")' 2>/dev/null || echo "false")

          if [ "$HAS_SKIP" = "true" ]; then
            # Layer 1 — [skip ci] wins: do not run. Hard veto over any force marker.
            RUN_LEVEL="none"; DEPTH_SOURCE="marker:skip-ci"; WHETHER_REASON="skipped-because:skip-ci-marker"
            echo "🛑 [skip ci] → run_level=none"
          elif [ "$HAS_FORCE_BUILD" = "true" ] || [ "$HAS_FORCE_FULL" = "true" ]; then
            # Layer 2 — how much to run. [force build] / [force full] both escalate to full.
            if [ "$HAS_FORCE_FULL" = "true" ]; then
              RUN_LEVEL="full"; DEPTH_SOURCE="marker:force-full"; WHETHER_REASON="ran-because:force-full"
              echo "✅ [force full] → run_level=full"
            else
              RUN_LEVEL="full"; DEPTH_SOURCE="marker:force-build"; WHETHER_REASON="ran-because:force-build"
              echo "✅ [force build] → run_level=full"
            fi
          elif [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RUN_LEVEL="full"; DEPTH_SOURCE="event:$EVENT_NAME"; WHETHER_REASON="ran-because:$EVENT_NAME"
            echo "✅ $EVENT_NAME → run_level=full"
          elif [ "$REF" = "refs/heads/main" ]; then
            RUN_LEVEL="full"; DEPTH_SOURCE="main-carveout"; WHETHER_REASON="ran-because:push-main"
            echo "✅ push main → run_level=full (main-carveout)"
          elif [ "$REF" = "refs/heads/dev" ]; then
            # Precondition 1 of release-PR mirror mode (docs/deployments.md § One CI run per
            # dev commit): EVERY dev push resolves full. A merged-PR dev push must not go
            # light — a promotion PR mirrors this push run's verdict, so a light push (tiers
            # skipped) would be inherited by the release PR. See Decide Release Mirror below.
            RUN_LEVEL="full"; DEPTH_SOURCE="dev-push"; WHETHER_REASON="ran-because:dev-push-full"
            echo "✅ dev push → run_level=full"
          else
            # Other refs (non-dev, non-main push).
            RUN_LEVEL="light"; DEPTH_SOURCE="event:push"; WHETHER_REASON="ran-because:push-other-ref"
          fi

          {
            echo "run_level=$RUN_LEVEL"
            echo "source=$DEPTH_SOURCE"
            echo "reason=$WHETHER_REASON"
          } >> "$GITHUB_OUTPUT"

      - name: Decide Release Mirror
        id: mirror
        # OPTIONAL — one CI run per dev commit (docs/deployments.md § One CI run per dev
        # commit). A same-repo promotion PR (dev, or release/* into the default branch) has a
        # head the dev push run already tested, so it mirrors that run instead of re-running
        # the suite. True → the LAST word in the plan (Generate Test Plan): run_level=none,
        # every lane skips, and the capstone's Mirror Push Run copies the dev push run's
        # verdict. bkit promotes via release/* → main, so dev alone never matches; bkit runs
        # mirror resolves the push run BY SHA — a release/* head with no green dev push run
        # fails red (exit 3), never silently passes. Field is REQUIRED in the plan (false when
        # off). See the template scaffold's FULL CI SCAFFOLD REFERENCE for the general shape.
        env:
          # User-controlled text (branch names) arrives via env: (runtime expansion,
          # injection-safe) — never inlined into the run: body.
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          MIRROR="false"
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" = "$REPO" ] \
             && [ -n "$DEFAULT_BRANCH" ] && [ "$BASE_REF" = "$DEFAULT_BRANCH" ]; then
            case "$HEAD_REF" in
              dev|release/*) MIRROR="true" ;;
            esac
          fi
          echo "mirror_push_run=$MIRROR" >> "$GITHUB_OUTPUT"
          if [ "$MIRROR" = "true" ]; then
            echo "✅ promotion PR ($HEAD_REF → $BASE_REF) → mirror_push_run=true (plan run_level=none)"
          else
            echo "promotion mirror not applicable → mirror_push_run=false"
          fi

      - name: Generate Test Plan
        id: scope
        # Prior-step outputs arrive via env: so JSON-array values keep their inner quotes
        # (a double-quoted "${{ ...json... }}" in the run body would corrupt --argjson).
        env:
          RUN_LEVEL: ${{ steps.level.outputs.run_level }}
          DEPTH_SOURCE: ${{ steps.level.outputs.source }}
          WHETHER_REASON: ${{ steps.level.outputs.reason }}
          MIRROR_PUSH_RUN: ${{ steps.mirror.outputs.mirror_push_run }}
          MARKERS: ${{ steps.markers.outputs.markers_present }}
          BASE: ${{ steps.base.outputs.base }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          # Release-PR mirror (Decide Release Mirror) is the LAST word: a same-repo
          # promotion PR mirrors the dev push run at its head, so every lane skips and the
          # capstone's Mirror Push Run owns the verdict. web_affected / run_e2e / run_live
          # stay false (single package, no deploy) — already the constant below.
          if [ "${MIRROR_PUSH_RUN:-false}" = "true" ]; then
            RUN_LEVEL="none"
            DEPTH_SOURCE="release-mirror"
            WHETHER_REASON="skipped-because:release-pr-mirror"
          fi
          # Single package, no deploy: web_affected / run_e2e / run_live /
          # global_dep_changed are constant false; the fields stay in the plan contract.
          PLAN_JSON=$(jq -cn \
            --arg schema "bkit-test-plan" \
            --arg run_level "${RUN_LEVEL:-none}" \
            --arg base "${BASE:-}" \
            --argjson mirror_push_run "${MIRROR_PUSH_RUN:-false}" \
            --argjson web_affected false \
            --argjson run_e2e false \
            --argjson run_live false \
            --argjson global_dep_changed false \
            --arg source "${DEPTH_SOURCE:-none}" \
            --arg reason "${WHETHER_REASON:-}" \
            --arg event "$EVENT_NAME" \
            --arg ref "$REF" \
            --argjson affected_packages '[]' \
            --argjson markers_present "${MARKERS:-[]}" \
            '{
              schema: $schema,
              run_level: $run_level,
              base: $base,
              mirror_push_run: $mirror_push_run,
              web_affected: $web_affected,
              run_e2e: $run_e2e,
              run_live: $run_live,
              global_dep_changed: $global_dep_changed,
              source: $source,
              reason: $reason,
              event: $event,
              ref: $ref,
              affected_packages: $affected_packages,
              markers_present: $markers_present
            }')

          # has()/!=null (NOT `.field // empty`): jq's // treats boolean false as absent,
          # so a legit run_live:false would read as a missing required field.
          FAIL=0
          for field in schema run_level base mirror_push_run web_affected run_e2e run_live source reason; do
            if ! echo "$PLAN_JSON" | jq -e --arg f "$field" 'has($f) and .[$f] != null' >/dev/null 2>&1; then
              echo "::error::Plan JSON missing required field: $field"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "::error::Plan JSON failed schema validation"
            exit 1
          fi

          echo "plan=$(echo "$PLAN_JSON" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "Plan JSON: $(echo "$PLAN_JSON" | jq -c .)"

      - name: Upload Test Plan
        if: "!cancelled()"
        env:
          PLAN: ${{ steps.scope.outputs.plan }}
        run: |
          RUN_LEVEL=$(echo "$PLAN" | jq -r '.run_level')
          DEPTH=$(echo "$PLAN" | jq -r '.source')
          WHETHER=$(echo "$PLAN" | jq -r '.reason')
          BASE=$(echo "$PLAN" | jq -r '.base')
          MIRROR=$(echo "$PLAN" | jq -r '.mirror_push_run')
          MARKERS=$(echo "$PLAN" | jq -r '.markers_present | join(", ")' 2>/dev/null || echo "")
          {
            echo "## CI Plan — \`bkit-tests-scope\` (single-package, no deploy/e2e/live)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| schema | bkit-test-plan |"
            echo "| run_level | \`$RUN_LEVEL\` |"
            echo "| mirror_push_run | \`$MIRROR\` |"
            echo "| base | \`${BASE:-<none>}\` |"
            echo "| source | \`$DEPTH\` |"
            echo "| reason | \`$WHETHER\` |"
            echo "| markers | ${MARKERS:-none} |"
            echo ""
            if [ "$RUN_LEVEL" = "none" ]; then
              if [ "$MIRROR" = "true" ]; then
                echo "> 🪞 **release-PR mirror** — every lane skipped; \`bkit-tests-check\` copies the dev push run's verdict."
              else
                echo "> ⏭️ **test lanes skipped** — $WHETHER"
              fi
            else
              echo "> ✅ **test lanes run** (run_level=\`$RUN_LEVEL\`); no web / e2e / live tiers."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write Cancellation Notice
        if: cancelled()
        run: |
          {
            echo "## CI Plan — bkit-tests-scope (CANCELLED)"
            echo ""
            echo "> ⚠️ Run cancelled before the plan-table could be written (concurrency cancel-in-progress)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── bkit-tests-static ────────────────────────────────────────────────────
  # Static-analysis lane: typecheck, lint, format, prose lint, slop, actionlint,
  # bkit check. Runs on a CLEAN tree (no test artifacts). Parallel sibling of
  # bkit-tests-unit — wall-clock = MAX(lane).
  bkit-tests-static:
    needs: [bkit-tests-scope]
    if: fromJSON(needs.bkit-tests-scope.outputs.plan).run_level != 'none'
    runs-on: ubuntu-latest
    # [verbose ci] marker — escalates CI log detail for one run. Composes freely with
    # [force build] / [force full] / [force cache] / [skip ci] (independent contains() per marker).
    # Markers are bare substrings — bkit-emitted commits prepend `bkit ` for attribution
    # (e.g. `bkit [verbose ci]`); substring match honours both forms.
    # See docs/deployments.md § "Commit-message force tags" for where to put the marker
    # (PR title for feature-branch pushes vs commit message for direct dev/main pushes)
    # and docs/testing.md § "CI verbosity" for the full knob list.
    #
    # NODE_OPTIONS is set HERE, in static YAML, and must NEVER be written to $GITHUB_ENV.
    # The runner blocklists NODE_OPTIONS for the $GITHUB_ENV / set-env workflow command:
    # the write is REJECTED with
    #   ##[error]Can't store NODE_OPTIONS output parameter using '$GITHUB_ENV' command.
    # while the step's conclusion stays `success`. The marker test is spelled out, not
    # `env.VERBOSE_CI`: the `env` context is NOT available to a job-level `env:` value. A
    # step with its own `env:` block REPLACES this value rather than merging, so such a
    # step must restate the flags. See docs/testing.md § "CI verbosity".
    env:
      TURBO_LOG_LEVEL: ${{ (contains(github.event.head_commit.message, '[verbose ci]') || contains(github.event.pull_request.title, '[verbose ci]')) && 'full' || 'errors-only' }}
      VERBOSE_CI: ${{ (contains(github.event.head_commit.message, '[verbose ci]') || contains(github.event.pull_request.title, '[verbose ci]')) && '1' || '' }}
      NODE_OPTIONS: ${{ (contains(github.event.head_commit.message, '[verbose ci]') || contains(github.event.pull_request.title, '[verbose ci]')) && '--trace-warnings --trace-deprecation' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so slop:delta can materialise the PR base ref as a worktree.
          fetch-depth: 0

      # Node/TS toolchain region. On a non-Node repo, replace these steps with your
      # stack's setup / install commands (and the typecheck / lint / test steps below with
      # its own). Replace `{{NODE_VERSION}}` with your Node major (`.bkit/templates.md`).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Pnpm version is resolved from the consumer's package.json#packageManager (single SoT).
      # Do NOT add `with: version:` here — pnpm/action-setup errors when both are set.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Under [verbose ci]: propagate DEBUG to all subsequent steps via $GITHUB_ENV. Note
      # that steps with their own `env:` block override $GITHUB_ENV — those steps must
      # inline it in their env: declaration to stay verbose-aware. NODE_OPTIONS is NOT
      # set here; the runner rejects that write while reporting success.
      # See the job-level `env:` block above.
      - name: Configure Verbose CI
        if: env.VERBOSE_CI == '1'
        run: |
          echo "🔊 [verbose ci] marker active — escalating log detail"
          echo "DEBUG=vercel:*,supabase:*" >> "$GITHUB_ENV"

      # Promotion-lag reminder (non-blocking). Renovate reads its config
      # ONLY from the default branch, and scheduled / default-branch-triggered Actions run the
      # default branch's copy of each workflow — so a renovate.json5 or .github/workflows/ edit
      # that lands on dev but is never promoted runs STALE for everyone until a dev -> default
      # branch PR lands. CI on dev validates the code; nothing otherwise checks it reached the
      # default branch. Warns (never fails) on dev pushes when those consumed-from-default-branch
      # surfaces differ — keyed ONLY on those surfaces, so ordinary app-code dev pushes stay
      # quiet. The default branch is read at runtime, so this step is identical for every repo.
      # Safe to keep in any repo: it only runs on dev pushes and self-skips when the default
      # branch is dev/unset, so it never fires where the dev -> default-branch flow does not apply.
      # See docs/deployments.md § "Promotion-lag warning".
      - name: Check Default Branch Lags Dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$DEFAULT_BRANCH" = "dev" ]; then
            echo "::notice::promotion-lag check skipped (default branch is '$DEFAULT_BRANCH')"
            exit 0
          fi
          if ! git fetch --no-tags --quiet origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" 2>/dev/null; then
            echo "::notice::promotion-lag check skipped — could not fetch $DEFAULT_BRANCH"
            exit 0
          fi
          SURFACES=(.github/renovate.json5 .github/renovate.json .github/workflows)
          STALE=$(git diff --name-only "origin/$DEFAULT_BRANCH" HEAD -- "${SURFACES[@]}" 2>/dev/null || true)
          if [ -z "$STALE" ]; then
            echo "consumed-from-$DEFAULT_BRANCH surfaces match $DEFAULT_BRANCH — nothing stale to promote."
            exit 0
          fi
          BEHIND=$(git rev-list --count "origin/$DEFAULT_BRANCH..HEAD" 2>/dev/null || echo "?")
          {
            echo "### WARNING: $DEFAULT_BRANCH is serving stale consumed surfaces"
            echo ""
            echo "\`$DEFAULT_BRANCH\` is **$BEHIND commit(s)** behind \`dev\`, and these files — which Renovate and scheduled / default-branch Actions read LIVE from \`$DEFAULT_BRANCH\` — differ from \`dev\`:"
            echo ""
            printf '%s\n' "$STALE" | sed 's/^/- /'
            echo ""
            echo "They run the **$DEFAULT_BRANCH** version until promoted. Open a \`dev\` -> \`$DEFAULT_BRANCH\` PR to apply them."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::$DEFAULT_BRANCH is $BEHIND commit(s) behind dev and consumed-from-$DEFAULT_BRANCH surfaces (Renovate config / workflows) differ — they run STALE until you promote dev -> $DEFAULT_BRANCH. See the run summary."

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Static checks first — they read the source tree and must scan it CLEAN.
      # Vitest/build run AFTER (below): they write coverage, dist/, and other
      # artifacts that would otherwise pollute the Slop Scan and bkit check inputs.
      # Keep this group (typecheck → lint → prettier → vale → slop → bkit check) ahead of
      # the test/build group if you reorder.
      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Lint
        run: pnpm lint

      - name: Run Prettier
        run: pnpm format:check

      # vale is not on the runner and .vale/styles/ is gitignored, so without this step
      # `pnpm lint:prose` guard-skips (write-good missing) and the prose gate is silently
      # dead. Pinned tarball + `vale sync` (else E100: write-good missing).
      - name: Install Vale
        env:
          # renovate: datasource=github-releases depName=errata-ai/vale
          VALE_VERSION: "3.24.0"
          # sha256 of vale_${VALE_VERSION}_Linux_64-bit.tar.gz (from the release's checksums.txt).
          # Bump alongside VALE_VERSION; verified before extract so a tampered/CDN-swapped tarball fails closed.
          VALE_SHA256: "fbc2eb47d0b8c50220ed1a2c5c611fbe0904ed567d638143d482016a18fd2db0"
        run: |
          curl -fsSL --retry 3 --retry-all-errors "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o "$RUNNER_TEMP/vale.tar.gz"
          echo "${VALE_SHA256}  $RUNNER_TEMP/vale.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          # vale sync pulls styles (write-good) from GitHub — retry to survive a transient CDN/network blip.
          for i in 1 2 3; do
            "$RUNNER_TEMP/vale" sync && break
            [ "$i" = 3 ] && { echo "::error::vale sync failed after 3 attempts"; exit 1; }
            echo "::warning::vale sync attempt $i failed — retrying in 5s"; sleep 5
          done

      - name: Run Vale Prose Lint
        run: pnpm lint:prose

      - name: Run Slop Scan
        run: pnpm lint:slop

      # The ENFORCING slop gate (lint:slop above is an advisory full-scan that never fails).
      # Runs on every event against the planner's base — a PR's base branch, or a push's last
      # green run — and fails on findings this change ADDS or WORSENS vs base. Needs
      # fetch-depth: 0 (set on checkout) so the base SHA is present to materialise as a worktree.
      - name: Run Slop Delta
        env:
          BASE_SHA: ${{ fromJSON(needs.bkit-tests-scope.outputs.plan).base }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "::notice::no diff base resolved — skipping slop delta"
            exit 0
          fi
          pnpm slop:delta "$BASE_SHA"

      # actionlint validates .github/workflows/* with GitHub-Actions-aware rules
      # (${{ }} expression syntax, shellcheck on run: blocks). A YAML linter accepts
      # workflows that are valid YAML but invalid GHA; actionlint catches that class.
      - name: Run actionlint
        run: |
          # Script pinned to the v1.7.12 commit SHA (the git tag is mutable/forgeable); the binary version
          # is pinned separately via the 1.7.12 arg passed to the script below.
          curl -sSfL --retry 3 --retry-all-errors https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash -o "$RUNNER_TEMP/download-actionlint.bash"
          # download-actionlint.bash fetches the binary from GitHub releases — retry to survive a transient CDN/network blip.
          for i in 1 2 3; do
            # renovate: datasource=github-releases depName=rhysd/actionlint
            bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.12 "$RUNNER_TEMP" && break
            [ "$i" = 3 ] && { echo "::error::actionlint download failed after 3 attempts"; exit 1; }
            echo "::warning::actionlint download attempt $i failed — retrying in 5s"; sleep 5
          done
          "$RUNNER_TEMP/actionlint" -color

      - name: Run bkit Check
        run: pnpm bkit check

      # Dependency-audit gate: fails on a high or critical advisory in the lockfile that
      # scripts/ci/accepted-advisories.json does not accept with a reason and an in-date expiry.
      # Self-skips when the guard is absent — a repo that did not adopt
      # scripts/ci/check-dependency-audit.mjs is a no-op. deployments.md § Dependency updaters.
      - name: Check Dependency Audit
        if: hashFiles('scripts/ci/check-dependency-audit.mjs') != ''
        run: node scripts/ci/check-dependency-audit.mjs

      # bkit repo only: dist/ is committed; rebuild it and fail when it differs.
      - name: Assert Dist Freshness
        run: pnpm bkit:check:dist

      # bkit repo only: status-hole detector, advisory (exits 0 when it finds holes).
      - name: Check Status Holes
        run: pnpm bkit:audit:status || true

      # Capability-register freshness gate: rebuild the graph with graphify and fail when
      # docs/capabilities.md is not what this tree produces, so the register cannot drift
      # silently. Self-skips when the graphify wrapper is absent — a repo that did not adopt
      # scripts/graphify/ is a no-op. graphify is pinned because its output must match the
      # committed register to the byte: bump GRAPHIFY_SPEC (bkit-graphify.sh) and refresh the register together.
      # Every event, PRs included, judging the tree that lands. A pull_request checkout is
      # GitHub's test merge of the PR into its base: the tree a squash merge puts on the base,
      # so its verdict is the post-merge push run's verdict. A PR behind its base can red here
      # with a clean head, when two branches' registers merge line by line into a file no
      # rebuild produces; merging the base into the branch, `pnpm graph:refresh` and a commit
      # clear it. `check-at HEAD` rebuilds in a throwaway worktree of the checked-out commit —
      # the same primitive the pre-push gate runs — so the release installed, the script run
      # and the register judged all come from that one tree.
      - name: Setup uv
        if: hashFiles('scripts/graphify/bkit-graphify.sh') != ''
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.4"

      - name: Check Capability Register
        if: hashFiles('scripts/graphify/bkit-graphify.sh') != ''
        # graphify release pinned once: GRAPHIFY_SPEC in bkit-graphify.sh. Same release here,
        # in the pre-push gate and by hand.
        run: |
          uv tool install "$(bash scripts/graphify/bkit-graphify.sh spec)"
          # `uv tool install` drops the shim in ~/.local/bin, not on this step's PATH.
          export PATH="$HOME/.local/bin:$PATH"
          if ! bash scripts/graphify/bkit-graphify.sh check-at HEAD; then
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              echo "::error title=Capability register::Checked this PR merged into $GITHUB_BASE_REF. If the branch is behind $GITHUB_BASE_REF, merge $GITHUB_BASE_REF into it first, then pnpm graph:refresh, commit and push."
            fi
            exit 1
          fi

  # ── bkit-tests-unit ───────────────────────────────────────────────────────
  # Unit lane. Parallel sibling of bkit-tests-static and bkit-tests-integration.
  bkit-tests-unit:
    needs: [bkit-tests-scope]
    if: fromJSON(needs.bkit-tests-scope.outputs.plan).run_level != 'none'
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block: pull-requests: write posts
    # the coverage comment.
    permissions:
      contents: read
      pull-requests: write
    outputs:
      tests_ran: ${{ steps.vitest.outputs.ran }}
    # Env vars duplicated from bkit-tests-static's job-level `env:`.
    # See the comment above that `env:` in bkit-tests-static — NODE_OPTIONS is a
    # static YAML key here and never a $GITHUB_ENV write.
    env:
      TURBO_LOG_LEVEL: ${{ (contains(github.event.head_commit.message, '[verbose ci]') || contains(github.event.pull_request.title, '[verbose ci]')) && 'full' || 'errors-only' }}
      VERBOSE_CI: ${{ (contains(github.event.head_commit.message, '[verbose ci]') || contains(github.event.pull_request.title, '[verbose ci]')) && '1' || '' }}
      NODE_OPTIONS: ${{ (contains(github.event.head_commit.message, '[verbose ci]') || contains(github.event.pull_request.title, '[verbose ci]')) && '--trace-warnings --trace-deprecation' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # NODE_OPTIONS is a job-level `env:` key above, never a $GITHUB_ENV write — the runner
      # rejects that write and still reports success. See bkit-tests-static's block comment.
      - name: Configure Verbose CI
        if: env.VERBOSE_CI == '1'
        run: |
          echo "🔊 [verbose ci] marker active — escalating log detail"
          echo "DEBUG=vercel:*,supabase:*" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Workflow-fence syntax tests run each shell block under zsh, and the template test lints
      # the shipped bkit-ci.yml with actionlint. Each skips itself when its tool is absent, and the
      # runner image has neither on PATH, so without these steps they skip on every run.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Install actionlint
        run: |
          # Script pinned to the v1.7.12 commit SHA (the git tag is mutable/forgeable); the binary version
          # is pinned separately via the 1.7.12 arg passed to the script below.
          curl -sSfL --retry 3 --retry-all-errors https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash -o "$RUNNER_TEMP/download-actionlint.bash"
          # download-actionlint.bash fetches the binary from GitHub releases — retry to survive a transient CDN/network blip.
          for i in 1 2 3; do
            bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.12 "$RUNNER_TEMP" && break
            [ "$i" = 3 ] && { echo "::error::actionlint download failed after 3 attempts"; exit 1; }
            echo "::warning::actionlint download attempt $i failed — retrying in 5s"; sleep 5
          done
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Unit coverage: `test:coverage:unit` scopes --coverage.include to the logic files and
      # carries the --coverage.thresholds.branches floor; bkit:gate:static-unit runs the same
      # script. The JSON reporter feeds the executed-count bkit-tests-check asserts.
      - name: Run Unit Tests
        id: vitest
        run: |
          pnpm test:coverage:unit \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/unit-result.json"
          UNIT_RAN=$(jq '[.numPassedTests, .numFailedTests] | add' "$RUNNER_TEMP/unit-result.json")
          echo "ran=$UNIT_RAN" >> "$GITHUB_OUTPUT"
          echo "::notice::vitest executed $UNIT_RAN unit test(s)."

      # bkit repo only: bats over the shipped hook scripts and the gh stub harness.
      - name: Run Shell Tests (bats)
        run: pnpm exec bats tests/*.bats

      # A distinct name: keys each sticky comment so the two do not collide.
      # Runs on every event, including a red unit run (reportOnFailure keeps the summary), and
      # writes the coverage table with the floor as its target to the job summary; comments on
      # same-repo PRs only. vite-config-path is the file the floor lives in.
      - name: Report Unit Coverage
        if: ${{ !cancelled() && hashFiles('coverage/unit/coverage-summary.json') != '' }}
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          name: unit
          json-summary-path: coverage/unit/coverage-summary.json
          json-final-path: coverage/unit/coverage-final.json
          vite-config-path: vitest.unit.config.ts
          file-coverage-mode: changes          # per-file table limited to files changed in the PR
          comment-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && 'pr' || 'none' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── bkit-tests-integration ────────────────────────────────────────────────
  # Integration lane: *.integration.test.ts, coverage scoped to the engine surface
  # (modules / install / upgrade / uninstall). Report-only: no --coverage.thresholds;
  # bkit-tests-check gates it on its executed-count. Parallel sibling of static + unit.
  bkit-tests-integration:
    needs: [bkit-tests-scope]
    if: fromJSON(needs.bkit-tests-scope.outputs.plan).run_level != 'none'
    runs-on: ubuntu-latest
    # Same job-level permissions as bkit-tests-unit.
    permissions:
      contents: read
      pull-requests: write
    outputs:
      tests_ran: ${{ steps.vitest.outputs.ran }}
    # Env vars duplicated from bkit-tests-static's job-level `env:`.
    env:
      TURBO_LOG_LEVEL: ${{ (contains(github.event.head_commit.message, '[verbose ci]') || contains(github.event.pull_request.title, '[verbose ci]')) && 'full' || 'errors-only' }}
      VERBOSE_CI: ${{ (contains(github.event.head_commit.message, '[verbose ci]') || contains(github.event.pull_request.title, '[verbose ci]')) && '1' || '' }}
      NODE_OPTIONS: ${{ (contains(github.event.head_commit.message, '[verbose ci]') || contains(github.event.pull_request.title, '[verbose ci]')) && '--trace-warnings --trace-deprecation' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Configure Verbose CI
        if: env.VERBOSE_CI == '1'
        run: |
          echo "🔊 [verbose ci] marker active — escalating log detail"
          echo "DEBUG=vercel:*,supabase:*" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # The workflow snippet tests re-run the plan-close and lock blocks under zsh. They skip
      # themselves when zsh is absent and the runner image has none, so without this step they
      # skip on every run.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      # Integration coverage, scoped via --coverage.include to the engine surface.
      - name: Run Integration Tests
        id: vitest
        run: |
          pnpm exec vitest run --coverage --coverage.reportsDirectory=coverage/integration \
            integration.test \
            --coverage.include='.bkit/core/engine/{install/modules/*,commands/install/install,commands/install/upgrade,commands/install/uninstall}.ts' \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/int-result.json"
          INT_RAN=$(jq '[.numPassedTests, .numFailedTests] | add' "$RUNNER_TEMP/int-result.json")
          echo "ran=$INT_RAN" >> "$GITHUB_OUTPUT"
          echo "::notice::vitest executed $INT_RAN integration test(s)."

      - name: Report Integration Coverage on PR
        # hashFiles guard: skip cleanly when the repo has no integration tier (no coverage/integration report produced).
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('coverage/integration/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          name: integration
          json-summary-path: coverage/integration/coverage-summary.json
          json-final-path: coverage/integration/coverage-final.json
          file-coverage-mode: changes
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── bkit-tests-check ──────────────────────────────────────────────────────
  # Capstone and sole branch-protection required check (`bkit setup protect-main` reads
  # bkit.testing.ciCapstone). Needs every lane; if: !cancelled(), never always(). Asserts
  # bkit-tests-scope succeeded and, when run_level != none, every test lane succeeded and
  # unit + integration each executed >0 tests. bkit-tests-scope is the planner, not a
  # lane: SCOPE_RESULT asserts it by name, outside the per-lane loop. In release-PR mirror
  # mode (plan.mirror_push_run) every lane is skipped: Mirror Push Run copies the dev push
  # run's capstone verdict — the step IS the verdict, never run_level=none alone, because a
  # skipped required check can read as passed on the PR.
  bkit-tests-check:
    needs: [bkit-tests-scope, bkit-tests-static, bkit-tests-unit, bkit-tests-integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Mirror mode waits for the dev push run (--max-minutes 170), so raise the job ceiling
    # to 180 only then; null-safe when the planner failed before emitting a plan. Otherwise
    # the job just installs and asserts.
    timeout-minutes: ${{ needs.bkit-tests-scope.outputs.plan && fromJSON(needs.bkit-tests-scope.outputs.plan).mirror_push_run && 180 || 5 }}
    steps:
      # Mirror Push Run runs bkit, so the job needs a checkout and installed dependencies.
      # Both are ungated — the assert also reads the plan off the checkout, and gating a
      # checkout on a plan that may be absent is fragile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Mirror Push Run
        # OPTIONAL (Decide Release Mirror in bkit-tests-scope). Runs BEFORE the assert;
        # neither step is continue-on-error. Waits for the dev push run at the PR head and
        # passes only when its capstone passed — reds when that run failed, was cancelled,
        # its capstone is absent/skipped, or no push run appears within 10 min (a [skip ci]
        # tip dispatches none). See docs/deployments.md § One CI run per dev commit.
        if: fromJSON(needs.bkit-tests-scope.outputs.plan).mirror_push_run
        env:
          GH_TOKEN: ${{ github.token }}
          # PR head SHA (the dev tip the push run tested) via env:, injection-safe.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm bkit runs mirror --head="$PR_HEAD_SHA" --branch=dev --max-minutes=170

      - name: Assert Test Plan Followed
        # The verdict is scripts/ci/check-capstone.mjs, tested by check-capstone.test.mjs.
        # scope must succeed; with run_level != none every lane must succeed, and unit and
        # integration (the lanes with a *_RAN variable) must have run more than 0 tests; with
        # run_level=none every lane must be skipped; a plan that does not parse reds.
        # docs/testing.md § Validated means executed.
        env:
          LANES: static,unit,integration
          PLAN: ${{ needs.bkit-tests-scope.outputs.plan }}
          SCOPE_RESULT: ${{ needs.bkit-tests-scope.result }}
          STATIC_RESULT: ${{ needs.bkit-tests-static.result }}
          UNIT_RESULT: ${{ needs.bkit-tests-unit.result }}
          UNIT_RAN: ${{ needs.bkit-tests-unit.outputs.tests_ran }}
          INTEGRATION_RESULT: ${{ needs.bkit-tests-integration.result }}
          INTEGRATION_RAN: ${{ needs.bkit-tests-integration.outputs.tests_ran }}
        run: node scripts/ci/check-capstone.mjs
