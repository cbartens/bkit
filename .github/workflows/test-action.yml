name: Test setup-auth@v1 Action

# Meta-test workflow: verifies the setup-auth composite action runs without error.
# Manual smoke trigger only — not part of the main CI gate.
# After the v1 tag is pushed post-merge, consumers can reference:
#   uses: cbartens/bkit/.github/actions/setup-auth@v1

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual smoke test"
        required: false
        default: "Manual smoke test of setup-auth@v1"

jobs:
  smoke-setup-auth:
    name: "Smoke: setup-auth@v1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test setup-auth@v1 composite action
        uses: ./.github/actions/setup-auth
        with:
          token: ${{ secrets.GH_BKIT_TOKEN }}

      - name: Verify BKIT_READ_TOKEN is set in environment
        shell: bash
        run: |
          if [ -z "${BKIT_READ_TOKEN:-}" ]; then
            echo "ERROR: BKIT_READ_TOKEN is not set after setup-auth step"
            exit 1
          fi
          echo "PASS: BKIT_READ_TOKEN is set (value redacted)"
