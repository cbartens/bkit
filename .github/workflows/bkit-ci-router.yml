name: bkit-ci-router

# Wakes when the CI workflow completes on a `feat/**` branch and dispatches the
# bkit-ci-router orchestrator inside a fresh Claude Code session on the runner.
# The orchestrator (`.agents/workflows/bkit-ci-router.md`, mirrored to
# `.claude/commands/bkit-ci-router.md` via `bkit install`) decides ship vs.
# debug and invokes the matching skill in the same session. Cursor consumers
# configure the equivalent trigger in the Cursor cloud agents dashboard —
# this YAML is the Claude half only.
#
# Required secrets: ANTHROPIC_API_KEY, LINEAR_API_KEY. The auto-provided
# `github.token` (scoped by the `permissions:` block below) handles all repo
# git/gh access — GH_BKIT_TOKEN is package-install scoped and has no access
# to consumer repos, so this workflow does not use it.
# Required Linear label on the issue: `Auto` (opt-in).
# Docs: .agents/cloud.md § Post-CI auto-routing.

on:
  workflow_run:
    workflows: [CI]
    branches: ['feat/**']
    types: [completed]

concurrency:
  # Latest CI completion supersedes any in-flight router run on the same
  # branch. Ship squash-merge is a single GitHub-atomic API call, so a mid-run
  # cancel cannot leave the PR in a partial state.
  group: bkit-ci-router-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  # contents: write — the router commits + pushes the single per-run
  # status.json update to `dev` with `[skip ci]` (BAR-187 canonical pattern,
  # matches bkit-build / bkit-ship / bkit-debug close-workflow).
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  route:
    # Only fire on terminal CI conclusions. Skip cancelled / skipped runs.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      # BAR-148 diagnostic — print the inherited GITHUB_TOKEN's effective scopes
      # BEFORE checkout. Hypothesis: a workflow_run triggered by a pull_request
      # CI run inherits a read-scoped installation token regardless of the
      # receiver's permissions: block, which would explain the 403 on checkout.
      # Remove this step once root-cause is confirmed.
      - name: Probe inherited token scopes (BAR-148 diagnostic)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::group::workflow_run event context"
          echo "trigger event:       ${{ github.event.workflow_run.event }}"
          echo "source workflow:     ${{ github.event.workflow_run.name }}"
          echo "head branch:         ${{ github.event.workflow_run.head_branch }}"
          echo "head sha:            ${{ github.event.workflow_run.head_sha }}"
          echo "head repo fork:      ${{ github.event.workflow_run.head_repository.fork }}"
          echo "conclusion:          ${{ github.event.workflow_run.conclusion }}"
          echo "::endgroup::"
          echo "::group::repo .permissions via gh api (what GITHUB_TOKEN can see)"
          gh api "repos/${{ github.repository }}" --jq '.permissions' || echo "gh api failed: $?"
          echo "::endgroup::"
          echo "::group::repo-level Actions permissions"
          gh api "repos/${{ github.repository }}/actions/permissions" || echo "gh api failed: $?"
          echo "::endgroup::"
          echo "::group::raw token introspection via /repos endpoint"
          # 200 with `permissions.push:true` = write scope. 200 with push:false = read scope.
          # 403/404 = token can't even see the repo (a deeper auth problem).
          curl -sS -o /tmp/repo.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}"
          jq '.permissions // {error: .message}' /tmp/repo.json || cat /tmp/repo.json
          echo "::endgroup::"

      - uses: actions/checkout@v4
        with:
          # Check out `dev` at the workspace root so the router's
          # `$REPO_ROOT/docs/plans/logs/{FID}/status.json` resolves to dev's
          # working copy — matches the BAR-187 invariant that status.json
          # always lives on dev. The dispatched /bkit-ship or /bkit-debug
          # creates its own `feat/{FID}` worktree under `.worktrees/`.
          ref: dev
          fetch-depth: 0
          # The auto-provided GITHUB_TOKEN inherits the `permissions:` block
          # above (contents: write), which is what the router needs to push
          # status.json back to `dev`. Do not swap in GH_BKIT_TOKEN here — it
          # is scoped to the `@cbartens/bkit` package and has no access to
          # the consumer repo (would 403 on checkout).
          token: ${{ github.token }}

      - name: Configure git user
        run: |
          git config user.name 'bkit-ci-router[bot]'
          git config user.email 'bkit-ci-router@users.noreply.github.com'

      - name: Resolve PR number for head branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR_NUMBER=$(gh pr list --head "$BRANCH" --base dev --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "::notice::No open PR for branch $BRANCH — no-op exit."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch /bkit-ci-router on Claude Code runner
        if: steps.pr.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          prompt: "/bkit-ci-router ${{ github.event.workflow_run.conclusion }} ${{ steps.pr.outputs.number }}"
          # Lock the runner-side session to the same tool surface bkit grants
          # the local orchestrator (see .claude/settings.json `permissions.allow`).
          claude_args: "--allowed-tools=Bash,Edit,Write,Read,Grep,Glob,WebFetch,Skill,mcp__linear__*"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
