# Renovate — self-hosted runner (bkit-managed, Tier-1 canonical-overwrite).
#
# Rewritten on every `bkit install`; do NOT hand-edit (changes are clobbered — put
# repo-specific rules in `.github/renovate-local.json5` instead). Written ONLY when
# you install with `--renovate=self`; a `--renovate=mend`
# re-install reclaims it. This is the alternative to the Mend-hosted Renovate GitHub
# App: it runs Renovate on `ubuntu-latest` (~16 GB) instead of Mend's 3 GB hosted
# microvm, which physically OOMs (`kernel-out-of-memory`) on large pnpm monorepos.
# See docs/deployments.md § Self-hosted Renovate and KN-CORE-10.
#
# MUTUAL EXCLUSION: the Mend Renovate App MUST be suspended for this repo, or both
# open the same `renovate/*` PRs. bkit cannot verify that (off-repo) — it only warns.
#
# SHA-pinned per docs/deployments.md § GitHub Actions pinning. New SHAs arrive via
# `bkit install`; this file is in renovate.json5 `ignorePaths`, so consumer Renovate
# never bumps its own action pins (KN-CORE-5, same exemption as bkit-cloud.yml).
name: Renovate

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level (info | debug)"
        required: false
        default: "info"
        type: string
      dryRun:
        description: "Dry-run mode (full | null)"
        required: false
        default: "null"
        type: string
  schedule:
    # Wake the bot every 4h, all week. Renovate's OWN schedule in renovate.json5
    # ("before 6am on Monday") gates when normal update PRs open; this cron only
    # wakes the bot. Do NOT narrow it to Monday-only: osvVulnerabilityAlerts CVE PRs
    # bypass the internal schedule and must be able to fire within hours, not once a
    # week. Off-hour minute avoids top-of-hour congestion; each wake is a fast no-op
    # when nothing is due (Renovate exits in seconds outside its window).
    - cron: "17 */4 * * *"

# Least privilege: Renovate authenticates EVERY GitHub operation with GH_BKIT_TOKEN
# below (a fine-grained PAT or App token — NOT GITHUB_TOKEN, whose PRs do not trigger
# downstream CI, so platformAutomerge / branch-protection would never fire). The job
# GITHUB_TOKEN therefore needs no write scope.
permissions:
  contents: read

# Serialise runs — two overlapping Renovate processes race on the same renovate/*
# branches and the Dependency Dashboard issue. Queue rather than cancel: cancelling
# mid-push can leave a half-written branch/PR, and Renovate is idempotent so a queued
# run that supersedes an identical pending one is harmless.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest # ~16 GB — the headroom that fixes Mend's 3 GB OOM
    timeout-minutes: 30
    steps:
      # No checkout / configurationFile: Renovate clones the repo itself and
      # autodiscovers `.github/renovate.json5` as the repo config from the default
      # branch — the same file Mend reads. (For a MULTI-repo self-hosted bot instead,
      # split a global config.js and pass it via `configurationFile:`.)
      #
      # HARDENING (durable, no annual expiry) — mint a GitHub App token instead of a
      # PAT. Add before this step:
      #   - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      #     id: app-token
      #     with:
      #       app-id: ${{ secrets.RENOVATE_APP_ID }}
      #       private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      # then set `token: ${{ steps.app-token.outputs.token }}` below.
      - uses: renovatebot/github-action@dd5302ec17783b2fc721b19ae7209b57b1587765 # v46.1.17
        with:
          # Fine-grained PAT secret (default). Repository permissions (this repo):
          #   Contents: Read and write · Pull requests: Read and write ·
          #   Workflows: Read and write (the github-actions manager edits
          #   .github/workflows/* SHAs) · Issues: Read and write (Dependency Dashboard) ·
          #   Dependabot alerts: Read (GitHub's vulnerability feed) · Metadata: Read-only.
          # (Personal-account tokens only: Account permission "Email addresses: Read" lets
          # Renovate use your verified email as the git author — org-owned tokens have no
          # such permission, so set RENOVATE_GIT_AUTHOR below instead.)
          token: ${{ secrets.GH_BKIT_TOKEN }}
        env:
          # Scope to THIS repo only — never org-wide autodiscover.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_PLATFORM: github
          # Commit author for Renovate's branches. Optional but recommended on ORG repos:
          # org-owned fine-grained PATs cannot grant "Email addresses", so Renovate can't
          # read your email and falls back to the Mend bot author (Unverified commits).
          # Set the repo variable RENOVATE_GIT_AUTHOR (Settings -> Secrets and variables ->
          # Actions -> Variables), e.g. `Renovate Bot <renovate@your-domain>`. Leave the
          # variable unset on personal-account repos where the token has Email addresses: Read.
          RENOVATE_GIT_AUTHOR: ${{ vars.RENOVATE_GIT_AUTHOR }}
          # allowedEnv is a GLOBAL-only Renovate option (security): it allow-lists which
          # env-var names the repo config's `env:` block may set. renovate.json5 ships
          # `env: { PNPM_WORKERS, PNPM_MAX_WORKERS }` (single-source config, kept even
          # though the OOM it mitigates can't happen on 16 GB) — without this the config
          # is REJECTED ("Env variable name PNPM_WORKERS is not allowed by this bot's
          # allowedEnv") and Renovate does nothing. Mend allows these via its safeEnv
          # preset; self-hosted must set it explicitly. Glob covers any future PNPM_* var.
          RENOVATE_ALLOWED_ENV: "PNPM_*"
          # Private-registry read auth for the restricted @cbartens/bkit package,
          # injected via env so the consumer-owned renovate-local.json5 needs NO
          # Mend-only "{{ secrets.* }}" templating (keep its token: line COMMENTED on
          # self-hosted). GH_BKIT_TOKEN_INSTALL (read:packages) is already a repo Actions
          # secret. Without this, lockfile regen 401s and every dep PR fails CI with
          # ERR_PNPM_OUTDATED_LOCKFILE. See docs/deployments.md § Renovate read-auth.
          RENOVATE_HOST_RULES: >-
            [{"matchHost":"npm.pkg.github.com","hostType":"npm","token":"${{ secrets.GH_BKIT_TOKEN_INSTALL }}"}]
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || 'null' }}
          # This env block deliberately declares NO ANTHROPIC_API_KEY / LINEAR_API_KEY
          # — the Renovate runner must never see them (docs/security.md § Supply-Chain
          # token isolation). Do not add them.
