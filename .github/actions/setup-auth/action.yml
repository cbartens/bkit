name: "bkit: Setup npm auth"
description: |
  Composite action that configures npm authentication for the @cbartens scope
  on GitHub Packages. Wraps the multi-line bash PAT-shim into a reusable step.

  Usage in consumer CI:
    - uses: cbartens/bkit/.github/actions/setup-auth@v1
      with:
        token: ${{ secrets.GH_BKIT_TOKEN }}

  The RETAIN-WITH-REASON bash PAT-shim block in seeded ci.yml is kept as a
  fallback for non-Actions CI consumers. Kill-date: v1.1.0.

inputs:
  token:
    description: |
      GitHub PAT with read:packages scope (classic PAT required — fine-grained
      PATs are not currently supported by GitHub Packages npm registry).
      Pass as: ${{ secrets.GH_BKIT_TOKEN }}
    required: true
  registry:
    description: |
      npm registry base URL for the @cbartens scope.
      Defaults to https://npm.pkg.github.com — only override for enterprise GitHub.
    required: false
    default: "https://npm.pkg.github.com"

runs:
  using: "composite"
  steps:
    - name: Configure @cbartens npm registry auth
      shell: bash
      env:
        BKIT_READ_TOKEN: ${{ inputs.token }}
        BKIT_REGISTRY: ${{ inputs.registry }}
      run: |
        # Write .npmrc auth token for the @cbartens scope registry.
        # The token is consumed by pnpm install via the BKIT_READ_TOKEN env var
        # referenced in the consumer's .npmrc:
        #   //npm.pkg.github.com/:_authToken=${BKIT_READ_TOKEN:-}
        #
        # This step exports BKIT_READ_TOKEN into the job environment so that
        # the subsequent pnpm install step can read it without re-declaring the
        # secret in each step.
        echo "BKIT_READ_TOKEN=${BKIT_READ_TOKEN}" >> "${GITHUB_ENV}"
        echo "Configured auth for ${BKIT_REGISTRY} (@cbartens scope)"
