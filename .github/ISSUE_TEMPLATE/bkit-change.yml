# Example issue form. Copy the ISSUE_TEMPLATE folder to `.github/ISSUE_TEMPLATE/` and own it.
# bkit install does not write this file and does not overwrite a copy.
# Shape and reference lines: .bkit/trackers.md § Issue shapes.
name: Well-defined change
description: You know what to build and how to tell it is done. This issue is the plan.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Write this as the plan: a build with no plan converts this issue into one.
        - `/bkit-plan #<issue number>` turns it into a checked plan; the build then proves each **TEST FIRST** test fails before its code exists.
        - `/bkit-build #<issue number>` converts this issue into a plan, then builds it and proves each **TEST FIRST** test fails before its code exists.
        - `build:lite` builds from this issue too but checks nothing: no failing-test proof, gates, PR or CI.

        Keep the title short: it names the feature folder. Nothing ticks boxes in an issue.
  - type: textarea
    id: narrative
    attributes:
      label: Narrative
      description: One or two sentences from the user's side. What they do and what they get back.
    validations:
      required: true
  - type: textarea
    id: success-criteria
    attributes:
      label: Success Criteria
      description: Up to five outcomes you can observe that prove it works. Outcomes, not steps.
      placeholder: |
        - A user who saves an item sees it in the list within 2s
    validations:
      required: true
  - type: textarea
    id: edge-cases
    attributes:
      label: Edge Cases
      description: Failures, conflicts and boundaries, and what should happen in each.
      placeholder: |
        | Scenario | Expected Behavior |
        | --- | --- |
        | Input is empty | Nothing is saved; the user sees why |
  - type: textarea
    id: tests
    attributes:
      label: Derived Test Matrix
      description: |
        One row per behaviour above, each covered by exactly one task. Type = the lowest tier that really exercises it, named as in `docs/testing.md`: Unit, Integration, E2E, @live (golden) or fresh-DB replay. The test must fail when the behaviour breaks.
      placeholder: |
        | Test description | Type | Target file |
        | --- | --- | --- |
        | Saved item appears in the list | E2E | `path/to/list.spec` |
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: |
        In build order, preferably in this shape, the same group and task blocks a plan uses: groups of up to `bkit.workflows.tasks.maxPerGroup` tasks (default 3) and `bkit.workflows.tasks.maxTestsPerGroup` **TEST FIRST** tests (default 15), each task a block, task numbers unique across the issue. **CREATE** / **READ** / **UPDATE** / **DELETE** = one line per file the task touches, as `` `symbol` in `file`: what to do `` or `` `file`: what to do ``. **DEPENDS ON** = the numbers of tasks it builds on, in the same or an earlier group. **DONE WHEN** = a check you can verify in the code (file exists, test passes, behaviour observable). **TEST FIRST** = the matrix tests that fail before the code exists, 1 to `bkit.workflows.tasks.maxTestsPerTask` per task (default 10) across up to `bkit.workflows.tasks.maxTestFilesPerTask` test files (default 3), one line each as `` `test file` `test name` fails on what goes wrong ``; or `n/a — reason` for docs, config, a pure refactor, or E2E / @live only. **TEST EXCEPTION** = written only by the owner: tests whose test-order gap you accept, each as in **TEST FIRST** ending `— reason`; it counts once committed alone in the plan. A **TEST EXCEPTION** written here is a request: the build copies it word for word, stops on it, and the owner confirms it at the build's Decision Pause, where Accept rewrites it with the owner's reason and date. Free text works too: the build converts it. A plan file for this issue wins: once one exists, the build reads its tasks only from the plan, never from here.
      placeholder: |
        <!-- bkit:group 1 start -->
        ### TASK GROUP 1: Saving items
        <!-- bkit:task 1 start -->
        - [ ] **TASK 1:** Refuse an empty item name
          - **UPDATE:** `saveItem` in `path/to/items`: refuse an empty name
          - **READ:** `path/to/list`: where saved items show
          - **DONE WHEN:** saving an empty name stores nothing and shows why
          - **TEST FIRST:**
            - `path/to/list.test` `rejects an empty name` fails on an empty name being saved
        <!-- bkit:task 1 end -->
        <!-- bkit:task 2 start -->
        - [ ] **TASK 2:** Show saved items in the list
          - **CREATE:** `path/to/list-row`: one row per saved item
          - **DELETE:** `ItemPreview` in `path/to/list`: replaced by the new row
          - **DEPENDS ON:** 1
          - **DONE WHEN:** a saved item appears in the list
          - **TEST FIRST:**
            - `path/to/list.test` `shows a saved item` fails on the list staying empty
          - **TEST EXCEPTION:**
            - `path/to/list.test` `shows a saved item` — the old preview already shows saved items, so it cannot fail first
        <!-- bkit:task 2 end -->
        <!-- bkit:group 1 end -->
    validations:
      required: true
  - type: textarea
    id: open-questions
    attributes:
      label: Open Questions & Assumptions
      description: Each with its options, your recommendation, and the default if nobody answers.
  - type: textarea
    id: breaking-changes
    attributes:
      label: Breaking Changes & Naming
      description: Anything renamed or removed (files, commands, routes, settings, data fields), and new names to agree on.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
      description: Nearby work this change must not do, and where it belongs instead.
  - type: textarea
    id: references
    attributes:
      label: References
      description: |
        The plan reads `**Parent design:**` and `**Audit reports:**` lines; the build refuses to start while an issue in the blocked-by block is open. Write them exactly as shown. Other references are not fetched, so use exact paths, ledger `key`s and issue numbers with titles.
      placeholder: |
        **Parent design:** [42-offline-sync-design.md](https://github.com/<owner>/<repo>/blob/dev/docs/plans/202610/42-offline-sync-design.md)
        **Audit reports:** docs/audits/202610/security.md (findings security-3, security-5)
        ###### bkit:blocked-by start
        - #<number>
        ###### bkit:blocked-by end
        Related: #<number> — <its title>
