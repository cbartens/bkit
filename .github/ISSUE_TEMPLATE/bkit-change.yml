# Example issue form. Copy the ISSUE_TEMPLATE folder to `.github/ISSUE_TEMPLATE/` and own it.
# bkit install does not write this file and does not overwrite a copy.
# Shape and reference lines: .bkit/trackers.md § Issue shapes.
name: Well-defined change
description: You know what to build and how to tell it is done. This issue is the plan.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Write this issue as the plan. A build with no plan converts this issue into one.
        - `/bkit-plan #<issue number>` turns this issue into a checked plan. The build then proves each **TEST FIRST** test fails before its code exists.
        - `/bkit-build #<issue number>` converts this issue into a plan, then builds it. It proves each **TEST FIRST** test fails before its code exists.
        - `build:lite` also builds from this issue, but it checks nothing: no failing-test proof, no gates, no PR and no CI.

        Keep the title short, because it names the feature folder. Nothing ticks boxes in an issue.
  - type: textarea
    id: narrative
    attributes:
      label: Narrative
      description: One or two sentences from the user's side, saying what they do and what they get back.
    validations:
      required: true
  - type: textarea
    id: success-criteria
    attributes:
      label: Success Criteria
      description: Up to five outcomes you can observe that prove it works. List outcomes, not steps.
      placeholder: |
        - A user who saves an item sees it in the list within 2s
    validations:
      required: true
  - type: textarea
    id: edge-cases
    attributes:
      label: Edge Cases
      description: Failures, conflicts and boundaries, and what should happen in each.
      placeholder: |
        | Scenario | Expected Behavior |
        | --- | --- |
        | Input is empty | Nothing is saved; the user sees why |
  - type: textarea
    id: tests
    attributes:
      label: Derived Test Matrix
      description: |
        One row per behaviour above, each covered by exactly one task. The type is the lowest tier that really exercises the behaviour, named as in `docs/testing.md`: Unit, Integration, E2E, @live (golden) or fresh-DB replay. The test must fail when the behaviour breaks.
      placeholder: |
        | Test description | Type | Target file |
        | --- | --- | --- |
        | Saved item appears in the list | E2E | `path/to/list.spec` |
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: |
        List the tasks in build order. The preferred shape is the same group and task blocks a plan uses:
        - Each group holds up to `bkit.workflows.tasks.maxPerGroup` tasks (default 3) and `bkit.workflows.tasks.maxTestsPerGroup` **TEST FIRST** tests (default 15).
        - Each task is a block. Task numbers are unique across the issue.
        - **CREATE** / **READ** / **UPDATE** / **DELETE**: one line per file the task touches, as `` `symbol` in `file`: what to do `` or `` `file`: what to do ``.
        - **DEPENDS ON**: the numbers of the tasks it builds on, in the same group or an earlier one.
        - **DONE WHEN**: a check you can verify in the code. For example, a file exists, a test passes, or a behaviour is observable.
        - **TEST FIRST**: the matrix tests that fail before the code exists. A task has 1 to `bkit.workflows.tasks.maxTestsPerTask` tests (default 10), across up to `bkit.workflows.tasks.maxTestFilesPerTask` test files (default 3). Write one line each, as `` `test file` `test name` fails on what goes wrong ``.
        - **If** the task is docs, config, a pure refactor, or covered by E2E / @live only → write `n/a — reason` under **TEST FIRST**.
        - **TEST EXCEPTION**: written only by the owner. It lists the tests whose test-order gap you accept, each written as in **TEST FIRST** and ending `— reason`. It counts once it is committed alone in the plan.
        - A **TEST EXCEPTION** written here is a request. The build copies it word for word and stops on it. The owner confirms it at the build's Decision Pause, where Accept rewrites it with the owner's reason and date.

        Free text works too. The build converts it.

        A plan file for this issue wins. Once one exists, the build reads its tasks only from the plan, never from here.
      placeholder: |
        <!-- bkit:group 1 start -->
        ### TASK GROUP 1: Saving items
        <!-- bkit:task 1 start -->
        - [ ] **TASK 1:** Refuse an empty item name
          - **UPDATE:** `saveItem` in `path/to/items`: refuse an empty name
          - **READ:** `path/to/list`: where saved items show
          - **DONE WHEN:** saving an empty name stores nothing and shows why
          - **TEST FIRST:**
            - `path/to/list.test` `rejects an empty name` fails on an empty name being saved
        <!-- bkit:task 1 end -->
        <!-- bkit:task 2 start -->
        - [ ] **TASK 2:** Show saved items in the list
          - **CREATE:** `path/to/list-row`: one row per saved item
          - **DELETE:** `ItemPreview` in `path/to/list`: replaced by the new row
          - **DEPENDS ON:** 1
          - **DONE WHEN:** a saved item appears in the list
          - **TEST FIRST:**
            - `path/to/list.test` `shows a saved item` fails on the list staying empty
          - **TEST EXCEPTION:**
            - `path/to/list.test` `shows a saved item` — the old preview already shows saved items, so it cannot fail first
        <!-- bkit:task 2 end -->
        <!-- bkit:group 1 end -->
    validations:
      required: true
  - type: textarea
    id: open-questions
    attributes:
      label: Open Questions & Assumptions
      description: List each one with its options, your recommendation, and the default if nobody answers.
  - type: textarea
    id: breaking-changes
    attributes:
      label: Breaking Changes & Naming
      description: Anything renamed or removed (files, commands, routes, settings, data fields), and new names to agree on.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
      description: Nearby work this change must not do, and where it belongs instead.
  - type: textarea
    id: references
    attributes:
      label: References
      description: |
        The plan reads the `**Parent design:**` and `**Audit reports:**` lines. The build refuses to start while an issue in the blocked-by block is open. Write these lines and the blocked-by block exactly as shown. Nothing fetches the other references, so use exact paths, ledger `key`s, and issue numbers with their titles.
      placeholder: |
        **Parent design:** [42-offline-sync-design.md](https://github.com/<owner>/<repo>/blob/dev/docs/plans/202610/42-offline-sync-design.md)
        **Audit reports:** docs/audits/202610/security.md (findings security-3, security-5)
        ###### bkit:blocked-by start
        - #<number>
        ###### bkit:blocked-by end
        Related: #<number> — <its title>
