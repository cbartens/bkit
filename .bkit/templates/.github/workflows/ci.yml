# =============================================================================
# FULL CI SCAFFOLD REFERENCE — every step, in execution order. Reference impl:
# gether app-gether-life (proven turbo + Vercel + Supabase + Playwright monorepo).
# Concept: bkit #203.
#
# The parallel bkit-tests-static + bkit-tests-unit jobs ABOVE are the any-repo
# starter. Below is the complete proven scaffold. To adopt a tier, lift its steps KEEPING THIS ORDER (load-bearing:
# static checks before env pull; resolve URL before integration; await deploy before
# E2E; capstone last). Replace gether-specifics (apps/web, *.vercel.app, VERCEL_*/
# SUPABASE_*). Tags: [U]niversal already in the starter; [M]onorepo/[D]eploy/[E]2E/
# [DB] opt-in by stack.
#
# WHY: "green" must mean "the planned tests ran and passed", not "nothing failed". A
# partial/cached/light run is green by construction, NOT validated. bkit-decide plans
# what should run; bkit-tests-check enforces it ran. green == validated.
#
# ORDER + gating (needs: + result guards). Each TIER is its own parallel LANE (job) — the proven
# shape bkit's own ci.yml (bkit-tests-static/unit/integration) and consumers gether/fraser run;
# NOT steps in one monolithic tests job. Bring a lane to life only if that tier applies to your repo:
#   bkit-decide                                              always-on, never skips
#   bkit-tests-static       needs:[decide]                   if: run_level != 'none'  ┐
#   bkit-tests-unit         needs:[decide]                   if: run_level != 'none'  │ parallel
#   bkit-tests-integration  needs:[decide]                   if: run_level != 'none'  │ test lanes
#   bkit-tests-e2e          needs:[decide]                   if: run_level != 'none'  │ (add the
#   bkit-tests-migrate      needs:[] (independent sibling)   always-on; gated on migration/seed change ┘  tiers you have)
#   bkit-tests-live         needs:[decide + all test lanes]  if: run_live && every test lane == 'success'
#   bkit-tests-check        needs:[decide + ALL lanes]       if: ${{ !cancelled() }} — asserts each lane succeeded AND each tier's *_ran > 0
#
# `bkit install`/`upgrade` raises an advisory per `# bkit-stub:` sentinel below;
# remove a sentinel header to dismiss (uncommenting alone does not).
#
# === JOB 1 — planner (always-on) ===
# bkit-stub:bkit-decide — emits the bkit-test-plan JSON. WHEN: CI has >1 run-type (PR/
# dev-push/release) or any skippable tier. bkit's OWN ci.yml is a single-package (no
# affected-graph) copy — start there if not a monorepo.
#   bkit-decide:  runs-on: ubuntu-latest; timeout-minutes: 2; outputs: { plan: ${{ steps.decide.outputs.plan }} }
#     steps:
#       - name: Checkout Repository          # [M] fetch-depth: 0 (turbo diffs need the base commit)
#       - name: Install Turbo                # [M] npm i -g turbo@<ver> (bare, ~10-15s; no pnpm install)
#       - name: Resolve Base Ref             # [M] PR->origin/<base>; push->github.event.before; dispatch->HEAD~1
# bkit-stub:affected-graph — [M] turbo "what changed" engine (the Detect Affected Packages step).
#       # Capture stdout/stderr SEPARATELY: 2>&1 merges turbo's banner into the JSON -> jq falls back to
#       # [] = ghost-green. turbo error / no base / non-JSON -> global-dep fallback (web_affected=true). Drop for single-package.
#       # GLOBAL-DEP OVER-TRIGGER (docs-only reds e2e): turbo attributes ANY changed root path that is NOT in a
#       # workspace and NOT a declared globalDependency (docs/**, README, LICENSE, ...) to the root `//` package
#       # with reason FileChanged. A `global_dep_changed -> web_affected=true` force keyed on ANY `//` FileChanged
#       # therefore can't tell a real global-dep bump from a docs-only diff and over-triggers: web_affected=true
#       # schedules e2e, the host cancels the docs-only preview (no deploy), and Await Deployment then reds e2e on
#       # every docs push. FIX: gate the force on a REAL global-dep change — intersect the changed root files with
#       # turbo.json globalDependencies/globalEnv (+ root lockfile/package.json) and force web_affected only on a
#       # match; a non-triggering-root-only diff (docs/** etc.) must NOT force it (a docs-only-only guard is the
#       # same idea but misses a root README-only change). See docs/deployments.md
#       # § "turbo // over-triggers web_affected on docs-only diffs".
#       - name: Detect Affected Packages     # [M] sets web_affected / global_dep_changed
#       - name: Read Markers                 # [U] commit msg (push) / PR title (PR) via env: (injection-safe); [skip ci]/[skip actions] push-only
#       - name: Decide Run                   # [U] Layer 1 (whether): [skip ci] or affected-empty -> run_level=none
#       - name: Decide Run Level             # [U] Layer 2 (how-much): force-build/PR/dispatch/push-main -> full; push-dev ->
#       #     commits/{sha}/pulls: merged PR -> light, no PR (direct) -> full ESCALATE (the green!=validated fix); api-error/403 -> full. Needs pull-requests: read.
#       - name: Decide Run Live & E2E        # [D/E] web_affected_eff = web_affected || [force full] (#291; emit as plan.web_affected — drives integration/e2e/@live + the capstone uniformly).
#       #     run_e2e = run_level==full && web_affected_eff. run_live = push dev/main && web_affected_eff (@live stays PUSH-ONLY — real LLM/email side effects; a docs-only/empty [force full] push reaches it via web_affected_eff, NOT off a PR/dispatch).
#       - name: Generate Test Plan           # [U] id: decide. jq bkit-test-plan; validate with has()/!=null
#       #     (NOT `// empty` — jq's // treats false as absent, dropping a legit run_live:false). Prior outputs via env: for --argjson.
#       - name: Upload Test Plan             # [U] plan-table -> $GITHUB_STEP_SUMMARY (if: !cancelled())
#       - name: Write Cancellation Notice    # [U] if: cancelled() — note instead of a blank summary
#
# === JOB 2: the test lanes (static / unit / integration / e2e) — ONE JOB PER TIER ===
#   each: needs:[bkit-decide]; if: run_level != 'none'; timeout-minutes: 20
#   Every tier is its OWN parallel LANE (job), NOT a step. This is what bkit dogfoods (its own
#   .github/workflows/ci.yml runs bkit-tests-static + bkit-tests-unit + bkit-tests-integration as
#   separate jobs) and what consumers gether/fraser run (+ bkit-tests-e2e). Separate lanes give each
#   tier its own honest coverage number, its own executed-count, its own permissions, and true
#   parallelism. Add only the lanes your repo has. Cost/mitigation: docs/deployments.md § Parallel test lanes.
#   NON-HOLLOW outputs (REQUIRED — the capstone asserts via these): each lane emits its own <tier>_ran
#     (tests_ran) + cache_skip. A DECLARED tier can execute ZERO and still go green (vitest
#     --passWithNoTests / glob drift / all-skipped; `turbo run test:X` with no package declaring it),
#     so emit the count from the runner's machine summary (vitest --reporter=json ->
#     numPassedTests+numFailedTests; playwright --reporter=json -> stats.expected+unexpected) and
#     JOB 4 asserts >0 PER LANE. See bkit's own bkit-tests-check for the assert_ran pattern.
#   The step catalogue below lists EVERY step across all tiers in execution order — distribute them
#   across the per-tier lanes (static gates -> bkit-tests-static; unit -> bkit-tests-unit; integration
#   -> bkit-tests-integration; E2E + deploy-await -> bkit-tests-e2e), each lane doing its own checkout
#   + setup + install.
#   env: [D] scope TURBO_TOKEN/VERCEL_*/SUPABASE_* here (least-privilege); KEEP the named verbose-ci-env block from the starter (preflight checks it by name).
#     steps:
#       - name: Checkout Repository          # [U] fetch-depth: 0 only if running slop-scan delta
#       - name: Fetch Base Branch            # [M/PR] if: pull_request — base for --filter/diffs
#       - name: Guard Migration Immutability # [DB] if: PR — fail if an already-merged migration was edited (write a new one)
#       - name: Materialise Base Worktree    # [PR] base as detached worktree for slop-delta; loud-fail if it resolves to HEAD
#       - name: Setup pnpm                    # [U]
#       - name: Setup Node                    # [U] node-version: {{NODE_VERSION}}, cache: pnpm
#       - name: Configure Verbose CI         # [U] if: VERBOSE_CI=='1' — write NODE_OPTIONS/DEBUG to $GITHUB_ENV (steps with own env: must re-declare)
#       - name: Install Dependencies         # [U] pnpm install --frozen-lockfile
#       - name: Install Vale                  # [U] pinned tarball + `vale sync` (else E100: write-good missing)
#       - name: Run Lint                      # [U] static checks FAIL-FAST before env pull; PRs scope --filter=...[origin/<base>]
#       - name: Run Typecheck                 # [U]
#       - name: Run Prettier Format Check     # [U] CI-side format gate (hook-bypass net)
#       - name: Run Vale Prose Lint           # [U] same root lint:prose pre-push runs (local==CI)
#       - name: Run Slop Scan (full)          # [U] advisory baseline
#       - name: Run Slop Scan (delta)         # [PR] the real gate — blocks new/worsened vs base worktree
#       - name: Tear Down Base Worktree       # [PR] if: always() && pull_request
#       - name: Run Bkit Check                # [U] drift gate (same as pre-push); catches --no-verify/web-edit/cloud drift
#       - name: Pull Vercel Env Vars          # [D] preview vs prod env by branch; set CI_ENV_FILE; FAIL-FAST if critical secrets empty
#       - name: Validate Environment          # [D] env-shape checker (e.g. env-check.sh)
#       - name: Resolve Vercel URL            # [D] if: web_affected — this SHA's preview into $TARGET_URL (API by SHA, excl CANCELED/ERROR; no stale-branch fallback)
#       - name: Apply Supabase Migrations     # [DB] if: push && (main||dev)
#       #     [DB] BUILD-vs-MIGRATION RACE if the host auto-deploys on this push (build races this step; PG
#       #     42P01/42703/42704/3F000, redeploy-same-sha self-heals). Fix: serialise migrate -> deploy. See docs/deployments.md § Build-vs-migration race.
# bkit-stub:test-db — [DB] schema invariants ("every public table has RLS" etc., not app-defined). Two co-equal
#       # routes by deploy topology: pgTAP (`supabase db test` over supabase/tests/*.sql) against a CI-LOCAL fixture
#       # — fast/offline but can pass while prod drifts; OR a service_role-only catalog RPC from the @live tier
#       # (JOB 3) against the REAL deployed schema — the stronger check once you have a deploy.
#       - name: Run DB Tests (pgTAP)          # [DB] if: schema invariants matter; runs supabase/tests/*.sql
#       - name: Run Vitest Unit Tests         # [U] the one tier every repo has (source CI_ENV_FILE if needed)
#       - name: Report Coverage on PR # [U/PR] bkit-stub:coverage — davelosert/vitest-coverage-report-action posts a per-tier coverage comment (distinct name: unit|integration|e2e). With SEPARATE lanes each posts from its OWN lane: unit-cov here (gated on branches), integration-cov in bkit-tests-integration (report-only, gate-on-execution), e2e-cov in bkit-tests-e2e (bkit-stub:e2e-coverage, Monocart). Each lane needs job-level pull-requests: write + the json-summary/json reporters.
#       - name: Build All Packages            # [D] source env first
#       - name: Run Vitest Integration Tests  # [D] id: integration; if: web_affected; --continue (one failure must not mask the rest)
#       - name: Await Vercel Deployment       # [D/E] if: full && web_affected — wait READY before E2E; CANCELED/ERROR/timeout = fail
#       - name: Check Stale Test Data         # [DB] if: (full||run_e2e)&&web_affected; continue-on-error (hygiene warning)
#       - name: Run Playwright E2E Tests      # [E] id: e2e; if: (full||run_e2e)&&web_affected; [verbose ci] adds --trace=on (never --reporter — replaces config chain)
#       #     [E/PR] PR-tier the suite (@smoke subset on PRs via a PROJECT-scoped grep, full on push) AND, for migration-
#       #     coupled PRs, run a LOCAL-DB E2E pass (preview hits the migration-less shared dev DB). Both: docs/testing.md § "E2E on PRs".
#       - name: Upload Playwright Report      # [E] if: always() — per-test trace.zip survives mid-suite cancel (HTML report finalises only at end)
#       - name: Report Skipped Tests          # [E] if: always() && run_level=='light' — note E2E skipped on a light run
#
# === JOB 2a — integration lane (distribute JOB 2's integration steps into their OWN job) ===
# bkit-stub:bkit-tests-integration — [D] the integration tier as its OWN parallel lane (job), not a
# step in bkit-tests-unit. WHEN: you have *.integration.test.ts (multi-module wiring / real infra
# boundaries). Mirrors bkit's own bkit-tests-integration lane + consumers gether/fraser. Self-contained
# (own checkout/setup/install); gate heavy steps on web_affected; emit integration_ran; the
# bkit-stub:coverage integration report (report-only, name: integration) posts from HERE, not bkit-tests-unit.
#   bkit-tests-integration:  needs:[bkit-decide]; if: run_level != 'none'; timeout-minutes: 20
#   #   own job-level permissions: { actions: read, contents: read, pull-requests: write } for the coverage comment.
#     steps: Checkout / Setup pnpm+Node / Install → Build (if needed) → Run Vitest Integration Tests
#       (id: vitest; --continue so one failure doesn't mask the rest; --reporter=json → integration_ran) →
#       Report Integration Coverage on PR (davelosert, name: integration). Step detail: JOB 2 catalogue above.
#
# === JOB 2c — E2E lane (distribute JOB 2's E2E steps into their OWN job) ===
# bkit-stub:bkit-tests-e2e — [E] the E2E (Playwright) tier as its OWN parallel lane. WHEN: you have a
# browser E2E suite + a deploy/preview to hit. Mirrors gether/fraser. Self-contained; await the deploy
# READY first (bkit-stub:vercel-await); gate on run_e2e && web_affected; emit e2e_ran; the
# bkit-stub:e2e-coverage report (Monocart → davelosert, name: e2e) posts from HERE.
#   bkit-tests-e2e:  needs:[bkit-decide]; if: run_level != 'none'; timeout-minutes: 30
#   #   own job-level permissions block (same three) for the coverage comment.
#     steps: Checkout / Setup / Install → Await Vercel Deployment → Run Playwright E2E Tests
#       (id: e2e; if: run_e2e && web_affected; --reporter=json → e2e_ran; [verbose ci] adds --trace=on) →
#       Report E2E Coverage on PR (bkit-stub:e2e-coverage) → Upload Playwright Report (if: always()). See JOB 2 catalogue.
#
# === JOB 2b — migration replay gate (independent sibling of the test lanes) ===
# bkit-stub:bkit-tests-migrate — [DB] prove every migration replays from an EMPTY database
# (+ the seed loads) on a fresh ephemeral instance each run. WHEN: you have a migrations dir.
# Catches what `migrate deploy` / `db push --linked` cannot: a stale-volume migration a warm
# `start` silently never re-applies, or a seed that aborts on an empty store — invisible until the
# DB is rebuilt from scratch (see docs/testing.md, fresh-provision rule). bkit owns the always-runs,
# self-detecting, branch-protection-safe SCAFFOLD; you supply your stack's reset+seed (Supabase:
# `supabase db reset --local`; Prisma: `prisma migrate reset`; Drizzle/raw: replay every migration
# onto a throwaway DB, then seed). MULTIPLE MIGRATION SYSTEMS (e.g. Supabase public schema AND an
# ORM/CMS chain like Payload/Prisma): replay EVERY chain + trigger on EVERY migration dir, or the
# un-replayed chain is an unverified hole — see docs/testing.md § Provision backing services fresh.
# NOT in series before bkit-tests — they share no state (each
# provisions its own DB), so it runs in parallel and JOB 4 folds it into the capstone.
#   bkit-tests-migrate:  needs:[] (independent sibling); timeout-minutes: 15
#   # ALWAYS runs + reports a status (never a perpetually-pending required check); the heavy steps
#   # short-circuit when no migration/seed source changed, so a no-DB-change PR is a fast green.
#     steps:
#       - name: Checkout Repository           # fetch-depth: 0 — diff vs base to detect migration/seed changes
#       - name: Detect Migration/Seed Changes # id: detect; relevant=true/false. dispatch + no-usable-base (new branch / zero-SHA)
#       #     => run-to-be-safe; PR => diff vs origin/<base>; push => diff vs before-SHA, over migrations/ + seed + seed-generator paths.
#       - name: Provision Ephemeral DB        # [DB] if: relevant — fresh instance in Docker, NO shared infra / remote secrets (e.g. supabase start --exclude logflare,vector,supavisor,studio)
#       - name: Replay Migrations From Empty  # [DB] if: relevant — drop+recreate, replay ALL migrations in order, load the seed (e.g. supabase db reset --local). Non-zero on a bad migration OR a bad seed literal.
#       - name: Assert Seed Fixture Loaded    # [DB] if: relevant — a reset can exit 0 while a conditional INSERT no-ops; assert a known seed row exists (e.g. psql -tAc "select 1 from <table> where id='<known-id>'") so a silently-broken seed can't pass green.
#       - name: Tear Down                     # if: always() && relevant — stop the ephemeral instance.
#
# === JOB 3 — @live canary ===
# bkit-stub:bkit-tests-live — push-only @live vs the DEPLOYED url. WHEN: you have a deploy +
# want post-deploy @live smoke. Sequential after ALL the test lanes. DROP if no deploy (bkit does).
#   bkit-tests-live:  needs:[bkit-decide,bkit-tests-static,bkit-tests-unit,bkit-tests-integration,bkit-tests-e2e]; if: run_live && every test lane's result=='success'; timeout-minutes: 15
#     steps:
#       - name: Checkout Repository / Setup pnpm / Setup Node / Configure Verbose CI / Install Dependencies   # [U] same setup chain as bkit-tests
#       - name: Pull Vercel Env Vars         # [D] same branch-conditional env pull
#       - name: Run Live Tests               # @live needs the deployed URL (branch alias); --continue. e.g.:
#       #   DEPLOY_URL=https://your-app.example.com; TEST_URL=$DEPLOY_URL API_URL=$DEPLOY_URL/api/v1 npx turbo run test:live --continue
#       #   EMIT live_ran (executed count, as JOB 2 does) — `turbo run test:live` with no package declaring test:live runs NOTHING and
#       #   exits 0, so tests-live==success with live_ran=0 is the classic ghost-green. CI HOME: every @live-tagged test must live in a
#       #   package whose test:live script this tier invokes, or the tag is dead. JOB 4 asserts run_live => live_ran>0 as the backstop.
#       # SCHEMA INVARIANTS (recommended home once you have a deploy): a @live test validates the REAL deployed
#       # schema — stronger than pgTAP's CI-local fixture, which can stay green while prod drifts. It calls a
#       # SECURITY DEFINER, service_role-only catalog RPC (e.g. public.rls_coverage_gaps()) over REST — port-5432
#       # direct from CI runners is IPv4-flaky. Note: PostgREST `GET /rest/v1/` (OpenAPI) is service_role-only by
#       # default — fetch the exposed surface with the service-role key, then probe each table with the ANON key.
#       # AUTO-DISCOVERING (no hardcoded table list — catches the NEXT table too): (1) list every public table via the
#       # catalog RPC; (2) assert each has RLS enabled; (3) anon-probe each and assert it reads [] (no cross-tenant leak).
#       # Supabase/PostgREST is the WORKED EXAMPLE — swap the catalog source + anon-probe for your stack's equivalent
#       # (any store with row-scoped authz). RLS coverage is stack-specific, so bkit ships the PATTERN here, not a
#       # drop-in test. Full rationale: docs/testing.md § Schema-invariant DB checks.
#
# === JOB 4 — capstone (makes green == validated) ===
# bkit-stub:bkit-tests-check — THE sole branch-protection required check. WHEN: always, the
# moment any tier is skippable. ~seconds, no checkout.
#   bkit-tests-check:  needs:[bkit-decide,bkit-tests-static,bkit-tests-unit,bkit-tests-integration,bkit-tests-e2e,bkit-tests-migrate,bkit-tests-live]; if: ${{ !cancelled() }}; timeout-minutes: 2
#   # !cancelled() NOT always(): a concurrency-cancel must not stamp a bogus failure (failure() is not cancelled(), so real failures still fail).
#     steps:
#       - name: Check Test Plan Followed     # env: PLAN + each needs.<lane>.result + each lane's outputs.<tier>_ran count. Assert + exit 1 on mismatch:
#       #   decide==success; run_level!=none => static+unit==success; web_affected => bkit-tests-integration==success (its LANE result);
#       #   run_e2e && web_affected => bkit-tests-e2e==success (its LANE result, not skipped); run_live => bkit-tests-live==success; run_level==none ([skip ci]) asserts NOTHING.
#       #   bkit-tests-migrate==success ALWAYS (independent of run_level — it self-skips the heavy steps when no migration/seed changed but still reports success; a failed replay reds the capstone).
#       #   NON-HOLLOW (green==validated, not just "didn't fail"): for every tier that is DECLARED (entrypoint exists) AND planned-to-run, ALSO
#       #   assert its executed count > 0 — unit_ran (run_level!=none), integration_ran (web_affected), e2e_ran (run_e2e&&web_affected),
#       #   live_ran (run_live). A declared tier that exits 0 having run ZERO tests is green-by-construction, NOT validated. A tier with NO
#       #   entrypoint asserts nothing (a repo with no integration/E2E/@live tier is valid — bkit's own has none). Do NOT count a SHA-cache
#       #   short-circuit as zero (it was validated on the cached SHA): gate the count assertion on "this run actually executed the tier".
#       #   Then point protection here: bash .bkit/scripts/bkit-protect-main.sh (REQUIRED_JOB=bkit-tests-check; NOT bkit-decide — always green, would not block a tests failure).
#
# COMPOSES WITH bkit-cloud.yml: it routes on workflow_run.conclusion (success->ship, failure->debug);
# a red bkit-tests-check turns the whole run red, so the router reads the capstone for free. See .bkit/cloud.md.
#
# THE RULE (even with no CI): green != ran != validated. Confirm a FULL run of the touched tiers before
# trusting green — direct dev pushes auto-escalate to full, but a green capstone on a LIGHT run is not full validation.
# =============================================================================
