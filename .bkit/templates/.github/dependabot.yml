# Example Dependabot config. Copy it to `.github/dependabot.yml` and own it.
# Use this OR Renovate, not both.
#
# GitHub reads .github/dependabot.yml ONLY from the default branch (typically
# `main`). Merge it through to that branch before Dependabot opens PRs. PRs land
# on `dev` (per `target-branch:` below).
#
# exclude-paths keeps bkit-cloud.yml out of version-update PRs. bkit rewrites that
# file on install, so a pin PR for it never stays closed. exclude-paths does not
# suppress security-update PRs; close those for bkit-cloud.yml.
#
# Repo settings (not in this file): enable the dependency graph and Dependabot
# alerts. If this is your only updater, enable security updates. If you also run
# Renovate, disable Dependabot version updates and security updates so the two
# bots do not compete.
#
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  # GitHub Actions — refreshes SHA-pinned `uses:` lines on upstream releases
  # and CVE disclosures (paired with bkit's SHA-pinning rule documented
  # in docs/deployments.md § GitHub Actions pinning).
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
    exclude-paths:
      - ".github/workflows/bkit-cloud.yml"

  # npm — opt-in. Uncomment and tune to your monorepo shape. For pnpm
  # workspaces, `directory: "/"` relies on hoisting; for explicit per-workspace
  # coverage, replace with `directories: ["/", "/packages/*"]` (Dependabot v2.1+).
  # - package-ecosystem: npm
  #   directory: /
  #   target-branch: dev
  #   schedule:
  #     interval: weekly
  #   open-pull-requests-limit: 10
  #   commit-message:
  #     prefix: "chore(deps)"
  #     prefix-development: "chore(deps-dev)"
  #     include: scope
  #   groups:
  #     types:
  #       patterns:
  #         - "@types/*"
  #     dev-dependencies:
  #       dependency-type: development
