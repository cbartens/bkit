name: bkit-ci

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  bkit-tests-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
      - run: node --test
