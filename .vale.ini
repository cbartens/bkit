# bkit:start
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = write-good

[.agents/**]
BasedOnStyles = House
# bkit:end

# Vendored skill content — third-party docs loaded under multiple paths
# depending on harness. Each path needs its own scope block.
[**/.agents/skills/**/*.md]
House.LLMSlop = NO
House.Hedging = NO
House.Filler = NO
House.Verbose = NO

[**/.claude/skills/**/*.md]
House.LLMSlop = NO
House.Hedging = NO
House.Filler = NO
House.Verbose = NO

[**/.cursor/skills/**/*.md]
House.LLMSlop = NO
House.Hedging = NO
House.Filler = NO
House.Verbose = NO

# Meta-prompt about prose compression: enumerates hedging/verbose phrases
# verbatim as examples of what to strip, so House rules self-trigger.
[**/bkit-utility-compress-markdown.md]
House.LLMSlop = NO
House.Hedging = NO
House.Filler = NO
House.Verbose = NO

[*.md]
BasedOnStyles = write-good, House
write-good.ThereIs = warning
write-good.Passive = NO
write-good.TooWordy = NO
write-good.Weasel = NO
